          {path && <path d={path} fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" />}
          {points.length === 1 && <circle cx={points[0].x} cy={points[0].y} r="3" fill={color} aria-hidden="true" />}
        </svg>
      );
    };

                const nameEndsDegree = /\bdegree\b/i.test(p.name || '');
                const ariaBits = [p.name, placement, !nameEndsDegree ? (p.type || '') : '', pctLabel, 'Activate to open pathway'].filter(Boolean);
                return (
                  <li key={p.name} className="min-w-0" style={{ height: '100%' }}>
                    <button
                      type="button"

                      aria-label={ariaBits.join('. ') + '.'}
                      style={{ height: '100%', display: 'flex', flexDirection: 'column' }}
                      className={`w-full rounded-lg border ${t.cardBorder} ${dark ? 'hover:border-zinc-500 hover:bg-zinc-800/80' : 'hover:border-gray-400 hover:bg-gray-50'} ${t.card} text-left px-3 py-2.5 transition-colors cursor-pointer min-w-0`}
                    >
                      <div className="flex items-start justify-between gap-2">
                        <div className="text-sm font-semibold line-clamp-2 min-w-0">{p.name}</div>
                        <span className={`font-semibold tabular-nums text-sm flex-shrink-0 ${pathwayPctColor(p.pct, dark)}`}>
                          {p.pct === null || p.pct === undefined ? '—' : p.pct + '%'}
                        </span>
                      </div>
                      {placement && (
                        <div className={`text-[11px] leading-snug mt-1 line-clamp-2 ${t.textMuted}`}>{placement}</div>
                      )}
                      <div className={`text-[11px] mt-1 ${t.faint}`} style={{ marginTop: 'auto', paddingTop: '0.25rem' }}>
                        {p.type || 'Pathway'}

      return (
        <>
          {!c.offered ? (
            <>
              <div className={`rounded-xl border ${t.cardBorder} ${t.card} p-6 text-center ${mb}`}>
                <Icons.AlertCircle className="w-8 h-8 mx-auto mb-2 text-slate-400" aria-hidden="true" />
                <p className={`text-sm ${t.textMuted}`}>{c.found ? `No analytics for ${periodLabel(selectedTerm)}. This course was not offered (or not reported) in the selected period.` : 'This course was not found in the Course Analytics datasource.'}</p>
              </div>
              {showProgramMembership && programMembership}
            </>
          ) : (
            <>
              <div className={`grid ${compact ? 'grid-cols-2 gap-3' : 'grid-cols-1 sm:grid-cols-2 gap-4'} ${mb}`}>
                <div className={`rounded-xl border-2 ${statusBorderCls(c.ztcPct)} ${compact ? 'p-4' : 'p-5'} text-center`}>
                  <div className={`text-[10px] uppercase ${dark ? t.faint : 'text-gray-700'} mb-1`}>ZTC adoption</div>
                  <div className={`text-4xl font-bold ${pctColor(c.ztcPct, dark)}`}>{c.ztcPct === null ? '—' : c.ztcPct + '%'}</div>
                  {compact && (
                    <div className="mt-1 flex flex-wrap items-center justify-center gap-1">
                      <StatusBadge status={c.status} dark={dark} />
                      {c.coZtc && <CoBadge dark={dark} />}
                    </div>

                </div>
                <div className={`rounded-xl border ${t.cardBorder} ${t.card} ${compact ? 'p-4' : 'p-5'} text-center`}>

                    <span className="font-semibold">{m.ztcSec ?? 0}/{m.totalSec} sections ZTC</span>
                    {sectionPct !== null && <span className={`ml-1 ${t.textMuted}`}>({sectionPct}%)</span>}

          {showCatalogLink ? (
            <a href={`${COURSE_CATALOG_URL}${encodeURIComponent(c.subject + '-' + c.number)}`} target="_blank" rel="noopener noreferrer"
              className={`${compact ? 'flex w-full' : 'inline-flex'} items-center justify-center gap-2 px-4 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-semibold text-sm`}>
              <Icons.FileText className="w-4 h-4" aria-hidden="true" /> View in course catalog
            </a>
          ) : !compact && (
            <div role="note" tabIndex={0}
              className={`text-xs ${t.faint} text-center rounded px-2 py-1 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-500`}>
              Catalog link available for current and future term only.
            </div>
          )}
        </>
      );
    };

    // ============================================================
    // MAIN APP
    // ============================================================
    class AppErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }
      static getDerivedStateFromError(error) {
        return { error };
      }
      componentDidCatch(error, info) {
        console.error('ZTC Pathway Mapper render failure', error, info);
      }
      clearAndReload = () => {
        try {
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(UI_STORAGE_KEY);
        } finally {
          window.location.reload();
        }
      };
      render() {
        if (!this.state.error) return this.props.children;
        return (
          <main className="min-h-screen bg-zinc-950 text-zinc-100 flex items-center justify-center p-6">
            <div className="max-w-lg rounded-xl border border-red-500/50 bg-red-500/10 p-6">
              <h1 className="text-xl font-bold">The saved session could not be displayed</h1>
              <p className="mt-2 text-sm text-zinc-200">
                Clear the local session and reload the mapper. Your source CSV files are not affected.
              </p>
              <button type="button" onClick={this.clearAndReload}
                className="mt-4 rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700">
                Clear saved session and reload
              </button>
            </div>
          </main>
        );
      }
    }

    const App = () => {
      const [darkMode, setDarkMode] = useState(() => {
        try {
          const themePref = localStorage.getItem(STORAGE_KEY + '-theme');
          return themePref ? themePref === 'dark' : true;
        } catch (e) { return true; }
      });
      const [programs, setPrograms] = useState(null);
      const [analytics, setAnalytics] = useState(null); // { index, terms }
      const [terms, setTerms] = useState([]);
      // Courses are read one term at a time; pathways and the Dashboard one academic year.
      const [courseTerm, setSelectedTerm] = useState('');
      const [selectedYear, setSelectedYear] = useState('');
      const [selectedProgram, setSelectedProgram] = useState(null);
      const [search, setSearch] = useState('');
      const [typeFilter, setTypeFilter] = useState('all');
      const [pathwayAdoptionFilter, setPathwayAdoptionFilter] = useState('all');
      const [sortBy, setSortBy] = useState('adoption');
      const [primaryView, setPrimaryView] = useState('program'); // 'program' | 'courses'
      const [dashboardOpen, setDashboardOpen] = useState(false);
      const yearMode = primaryView !== 'courses' || dashboardOpen;
      const selectedTerm = yearMode ? selectedYear : courseTerm;
      const periodWord = yearMode ? 'Academic year' : 'Term';
      const [isNarrowViewport, setIsNarrowViewport] = useState(() =>
        typeof window !== 'undefined' && window.matchMedia('(max-width: 639px)').matches
      );
      const [selectedCourseKey, setSelectedCourseKey] = useState(null);
      const [courseStatusFilter, setCourseStatusFilter] = useState('all');
      const [selectedCourse, setSelectedCourse] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const loadedYears = catalogYears();
      const catalogMeta = loadedYears.length ? window.ZTC_CATALOGS[loadedYears[loadedYears.length - 1]].meta : null;
      const [pendingAnalRows, setPendingAnalRows] = useState(null);
      const [savedAt, setSavedAt] = useState(null);
      const [exportOpen, setExportOpen] = useState(false);
      const [showTrend, setShowTrend] = useState(true);
      const [showDashboardDetails, setShowDashboardDetails] = useState(false);
      const [dashboardModal, setDashboardModal] = useState(null);
      const [announce, setAnnounce] = useState('');
      const [storageNotice, setStorageNotice] = useState('');
      const [dragOverSlot, setDragOverSlot] = useState(null);
      const [landingAnnounce, setLandingAnnounce] = useState('');
      const [pendingScrollCourseKey, setPendingScrollCourseKey] = useState(null);
      const [restoreError, setRestoreError] = useState('');

      const exportMenuRef = useRef(null);
      const exportBtnRef = useRef(null);
      const dashboardToggleRef = useRef(null);
      const dashboardModalRef = useRef(null);
      const dashboardModalTriggerRef = useRef(null);
      const courseModalRef = useRef(null);
      const lastFocusedRef = useRef(null);
      const jumpAnnounceRef = useRef(null);
      const restoreCompleteRef = useRef(false);

      const t = darkMode ? THEME.dark : THEME.light;

      // ---- persistence ----
      useEffect(() => {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            const catalogSha = catalogsSha();
            if (parsed && parsed.catalogSha && catalogSha && parsed.catalogSha !== catalogSha) {
              throw new Error('Saved data was built with a different set of catalog files. Load the ZTC dataset again.');
            }
            let savedYear = '';
            try {
              savedYear = JSON.parse(localStorage.getItem(UI_STORAGE_KEY) || '{}')?.selectedYear || '';
            } catch (yearError) { savedYear = ''; }
            const restoreYear = catalogYears().includes(savedYear) ? savedYear : defaultYear(parsed?.terms || []);
            // Pathway structure is never stored (it would not fit the browser quota next to
            // the ZTC data); it is always rebuilt from the built-in catalog of the saved year.
            if (parsed) parsed.programs = programsFromCatalog(window.ZTC_CATALOGS?.[restoreYear]);
            const d = validatePersistedDataset(parsed);
            d.selectedYear = restoreYear;
            let uiRaw = null;
            try {
              const storedUi = localStorage.getItem(UI_STORAGE_KEY);
              uiRaw = storedUi ? JSON.parse(storedUi) : null;
            } catch (uiError) {
              console.warn('Ignoring invalid saved navigation state.', uiError);
            }
            const ui = validatePersistedUiState(uiRaw, d);
            setPrograms(d.programs);
            setAnalytics(d.analytics);
            setTerms(d.terms);
            setSelectedTerm(ui.selectedTerm);
            setSelectedYear(ui.selectedYear);
            setSelectedProgram(ui.selectedProgram);
            setSelectedCourseKey(ui.selectedCourseKey);
            setPrimaryView(ui.primaryView);
            setSearch(ui.search);
            setTypeFilter(ui.typeFilter);
            setPathwayAdoptionFilter(ui.pathwayAdoptionFilter);
            setCourseStatusFilter(ui.courseStatusFilter);
            setSortBy(ui.sortBy);
            setDashboardOpen(ui.dashboardOpen);
            setSavedAt(d.savedAt);
          }
        } catch (e) {
          console.warn('Saved ZTC Mapper data was rejected.', e);
          setRestoreError(`${e.message || 'Saved data is invalid'} Load the source CSV files again or clear the saved session.`);
        } finally {
          restoreCompleteRef.current = true;
        }
      }, []);

      useEffect(() => {
        if (!restoreCompleteRef.current || !programs || !analytics) return;
        let written = false;
        const persist = () => {
          if (written) return;
          written = true;
          try {
            localStorage.setItem(UI_STORAGE_KEY, JSON.stringify({
              schemaVersion: UI_SCHEMA_VERSION,
              selectedTerm: courseTerm,
              selectedYear,
              selectedProgram,
              selectedCourseKey,
              primaryView,
              search,
              typeFilter,
              pathwayAdoptionFilter,
              courseStatusFilter,
              sortBy,
              dashboardOpen
            }));
          } catch (e) {
            console.warn('Could not persist navigation state.', e);
            setStorageNotice('Could not save navigation state to this browser. The current tab will continue to work.');
          }
        };
        const timeout = window.setTimeout(persist, 250);
        // Flush a pending debounced write if the tab is hidden or unloaded
        // before the 250 ms timer fires (tab close, navigation, bfcache).
        window.addEventListener('pagehide', persist);
        return () => {
          window.clearTimeout(timeout);
          window.removeEventListener('pagehide', persist);
        };
      }, [
        programs, analytics, courseTerm, selectedYear, selectedProgram, selectedCourseKey, primaryView,
        search, typeFilter, pathwayAdoptionFilter, courseStatusFilter, sortBy, dashboardOpen
      ]);

      useEffect(() => {
        localStorage.setItem(STORAGE_KEY + '-theme', darkMode ? 'dark' : 'light');
        document.documentElement.classList.toggle('theme-light', !darkMode);
        document.documentElement.style.colorScheme = darkMode ? 'dark' : 'light';
      }, [darkMode]);

      useEffect(() => {
        const media = window.matchMedia('(max-width: 639px)');
        const updateViewport = () => setIsNarrowViewport(media.matches);
        updateViewport();
        media.addEventListener('change', updateViewport);
        return () => media.removeEventListener('change', updateViewport);
      }, []);

      // Export menu: dismiss on outside click / Escape (keyboard accessible)
      useEffect(() => {
        if (!exportOpen) return;
        const onDown = (e) => {
          if (exportMenuRef.current && !exportMenuRef.current.contains(e.target) &&
              exportBtnRef.current && !exportBtnRef.current.contains(e.target)) setExportOpen(false);
        };
        const onKey = (e) => { if (e.key === 'Escape') { setExportOpen(false); exportBtnRef.current && exportBtnRef.current.focus(); } };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('keydown', onKey);
        return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onKey); };
      }, [exportOpen]);

      // Dashboard panel: Escape closes without trapping focus (non-modal).
      useEffect(() => {
        if (!dashboardOpen) return;
        const onKey = (e) => {
          if (e.key !== 'Escape') return;
          if (exportOpen || selectedCourse || dashboardModal) return;
          if (document.querySelector('ul[role="listbox"]')) return;
          e.preventDefault();
          setDashboardOpen(false);
          window.requestAnimationFrame(() => dashboardToggleRef.current && dashboardToggleRef.current.focus());
        };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [dashboardOpen, exportOpen, selectedCourse, dashboardModal]);

      // Dashboard modal: focus the dialog, trap Tab, Escape to close, and restore the trigger.
      useEffect(() => {
        if (!dashboardModal) return;
        const node = dashboardModalRef.current;
        const getFocusable = () => node ? Array.from(node.querySelectorAll('button:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])')) : [];
        const timer = setTimeout(() => { const f = getFocusable(); (f[0] || node) && (f[0] || node).focus(); }, 0);
        const onKey = (e) => {
          if (e.key === 'Escape') {
            e.preventDefault();
            setDashboardModal(null);
            return;
          }
          if (e.key === 'Tab') {
            const f = getFocusable();
            if (!f.length) return;
            const first = f[0], last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
        };
        document.addEventListener('keydown', onKey);
        return () => {
          clearTimeout(timer);
          document.removeEventListener('keydown', onKey);
          const trigger = dashboardModalTriggerRef.current;
          dashboardModalTriggerRef.current = null;
          if (trigger && trigger.focus && document.contains(trigger)) trigger.focus();
        };
      }, [dashboardModal]);

      // Course modal: focus the dialog, trap Tab, Escape to close, restore focus on close
      useEffect(() => {
        if (!selectedCourse) return;
        if (!lastFocusedRef.current) lastFocusedRef.current = document.activeElement;
        const node = courseModalRef.current;
        const getFocusable = () => node ? Array.from(node.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])')) : [];
        const timer = setTimeout(() => { const f = getFocusable(); (f[0] || node) && (f[0] || node).focus(); }, 0);
        const onKey = (e) => {
          if (e.key === 'Escape') { e.preventDefault(); setSelectedCourse(null); return; }
          if (e.key === 'Tab') {
            const f = getFocusable(); if (!f.length) return;
            const first = f[0], last = f[f.length - 1];
            if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
            else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
          }
        };
        document.addEventListener('keydown', onKey);
        return () => {
          clearTimeout(timer);
          document.removeEventListener('keydown', onKey);
          const prev = lastFocusedRef.current;
          lastFocusedRef.current = null;
          if (prev && prev.focus && document.contains(prev)) prev.focus();
        };
      }, [selectedCourse]);

      // Announce context changes to assistive tech
      useEffect(() => {
        if (!programs || !selectedTerm) return;
        if (jumpAnnounceRef.current) {
          setAnnounce(jumpAnnounceRef.current);
          jumpAnnounceRef.current = null;
          return;
        }
        setAnnounce(dashboardOpen
          ? `Dashboard panel opened. Institution-wide ZTC adoption, ${periodWord.toLowerCase()} ${periodLabel(selectedTerm)}. ${primaryView === 'courses' ? (selectedCourseKey || 'No course selected') : (selectedProgram || 'No pathway selected')} ${isNarrowViewport ? 'is preserved while the reading pane is temporarily hidden.' : 'remains visible.'}`
          : primaryView === 'courses'
            ? `Courses, ${selectedCourseKey || 'none selected'}, ${periodWord.toLowerCase()} ${periodLabel(selectedTerm)}`
            : `${selectedProgram || 'no pathway'}, ${periodWord.toLowerCase()} ${periodLabel(selectedTerm)}`);
      }, [selectedProgram, selectedCourseKey, selectedTerm, primaryView, dashboardOpen, isNarrowViewport, programs]);

      const persist = (progs, anal, termList, term) => {
        try {
          const payload = {
            schemaVersion: DATASET_SCHEMA_VERSION,
            catalogSha: catalogsSha(),
            analytics: anal,
            terms: termList,
            selectedTerm: term,
            savedAt: new Date().toISOString()
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
          setSavedAt(payload.savedAt);
          setStorageNotice('');
        } catch (e) {
          console.warn('Could not persist dataset (storage limit). Data remains for this session.', e);
          setStorageNotice('Could not save data to this browser (storage limit). Your session will work until you close the tab.');
        }
      };

      const readFile = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(parseCSV(e.target.result));
        reader.onerror = reject;
        reader.readAsText(file);
      });

      const isCsvFile = (file) => {
        const name = String(file.name || '').toLowerCase();
        return name.endsWith('.csv') || file.type === 'text/csv' || file.type === 'application/vnd.ms-excel';
      };

      const loadPendingCsv = async (slot, file) => {
        const label = 'ZTC course dataset';
        if (!file || !isCsvFile(file)) {
          setError(`${label} must be a .csv file.`);
          return;
        }
        try {
          setError('');
          const rows = await readFile(file);
          setPendingAnalRows(rows);
          setLandingAnnounce(`${label} loaded, ${rows.length - 1} rows.`);
        } catch (err) {
          setError(`Could not read ${label} file.`);
        }
      };

      const handleAnalFile = async (e) => {
        const f = e.target.files[0];
        if (f) await loadPendingCsv('anal', f);
        e.target.value = '';
      };

      const uploadDropHandlers = (slot) => ({
        onDragEnter: (e) => { e.preventDefault(); e.stopPropagation(); setDragOverSlot(slot); },
        onDragOver: (e) => { e.preventDefault(); e.stopPropagation(); },
        onDragLeave: (e) => {
          e.preventDefault();
          if (!e.currentTarget.contains(e.relatedTarget)) setDragOverSlot(s => s === slot ? null : s);
        },
        onDrop: async (e) => {
          e.preventDefault();
          e.stopPropagation();
          setDragOverSlot(null);
          const file = e.dataTransfer?.files?.[0];
          if (file) await loadPendingCsv(slot, file);
        }
      });

      const uploadCardCls = (slot, loaded) => {
        if (loaded) return 'border-green-500/60 bg-green-500/5';
        if (dragOverSlot === slot) return darkMode ? 'border-blue-400 bg-blue-500/10' : 'border-blue-500 bg-blue-50';
        return t.cardBorder;
      };

      const buildDataset = () => {
        if (!pendingAnalRows) return;
        setLoading(true); setError('');
        try {
          const anal = buildAnalytics(pendingAnalRows);
          const year = defaultYear(anal.terms);
          const progs = programsFromCatalog(window.ZTC_CATALOGS?.[year]);
          const term = defaultTerm(anal.terms);
          setAnalytics({ index: anal.index });
          setTerms(anal.terms);
          setSelectedTerm(term);
          setSelectedYear(year);
          setPrograms(progs);
          const builtAnalytics = { index: anal.index };
          const firstByAdoption = progs
            .map(program => ({ program, pct: computeProgramView(program, builtAnalytics, year).adoptionPct }))
            .sort((x, y) => cmpNullLast(x.pct, y.pct, () => x.program.name.localeCompare(y.program.name)))[0];
          setSelectedProgram(firstByAdoption.program.name);
          setSelectedCourseKey(Object.keys(anal.index).sort()[0] || null);
          setPrimaryView('program');
          setDashboardOpen(false);
          setPendingAnalRows(null);
          persist(progs, { index: anal.index }, anal.terms, term);
        } catch (err) {
          setError(err.message || 'Failed to build dataset.');
        } finally {
          setLoading(false);
        }
      };

      const resetData = () => {
        if (!confirm('Clear the loaded ZTC dataset and start over?')) return;
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(UI_STORAGE_KEY);
        setPrograms(null); setAnalytics(null); setTerms([]); setSelectedTerm(''); setSelectedYear('');
        setSelectedProgram(null); setSelectedCourseKey(null); setPendingAnalRows(null); setSavedAt(null);
        setSearch(''); setTypeFilter('all'); setPathwayAdoptionFilter('all'); setCourseStatusFilter('all');
        setSortBy('adoption'); setPrimaryView('program'); setDashboardOpen(false); setRestoreError('');
      };

      const clearRejectedSession = () => {
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(UI_STORAGE_KEY);
        setRestoreError('');
        setLandingAnnounce('Saved session cleared. Load the ZTC course dataset to continue.');
      };

      // Each academic year is scored against its own catalog.
      const changeYear = (year) => {
        if (year === selectedYear || !window.ZTC_CATALOGS?.[year]) return;
        const progs = programsFromCatalog(window.ZTC_CATALOGS[year]);
        setSelectedYear(year);
        setPrograms(progs);
        if (!progs.some(p => p.name === selectedProgram)) {
          setSelectedProgram(progs.slice().sort((a, b) => a.name.localeCompare(b.name))[0]?.name || null);
        }
        setTypeFilter(current => current === 'all' || progs.some(p => p.type === current) ? current : 'all');
      };
      const yearInfo = useMemo(
        () => (analytics && selectedYear ? yearStatus(analytics, terms, selectedYear) : null),
        [analytics, terms, selectedYear]
      );
      const yearNote = yearInfo && (
        <span>
          Academic year {yearLabel(selectedYear)} (Fall, Spring, Summer) · survey completion {yearInfo.surveyPct === null ? 'unknown' : yearInfo.surveyPct + '%'}
          {yearInfo.inProgress && (
            <span className={darkMode ? 'text-amber-400' : 'text-amber-800'}> · <span className="font-semibold">In progress</span>: {yearInfo.reason}</span>
          )}
        </span>
      );

      // ---- derived ----
      const activeProgram = useMemo(
        () => programs ? programs.find(p => p.name === selectedProgram) : null,
        [programs, selectedProgram]
      );
      const programViewCache = useMemo(() => {
        // Filled on demand: one term costs ~200 views; all terms x pathways is ~4,000.
        return new Map();
      }, [programs, analytics, terms]);
      const cachedProgramView = (program, term) => {
        if (!program || !analytics) return null;
        const cacheKey = `${program.name}\u0000${term}`;
        let view = programViewCache.get(cacheKey);
        if (!view) {
          view = computeProgramView(program, analytics, term);
          programViewCache.set(cacheKey, view);
        }
        return view;
      };
      // The institution trend needs every term x pathway view; defer it until the
      // Dashboard is first opened (it stays available afterwards).
      const institutionTrendWantedRef = useRef(false);
      if (dashboardOpen) institutionTrendWantedRef.current = true;
      const institutionTrendWanted = institutionTrendWantedRef.current;
      const programView = useMemo(
        () => cachedProgramView(activeProgram, selectedTerm),
        [activeProgram, selectedTerm, programViewCache]
      );

      // After Courses → Pathway jump, scroll to the first matching course row
      useEffect(() => {
        if (primaryView !== 'program' || !pendingScrollCourseKey || !programView) return;
        const key = pendingScrollCourseKey;
        const id = window.requestAnimationFrame(() => {
          const el = document.querySelector(`[data-course-key="${CSS.escape(key)}"]`);
          if (el && typeof el.scrollIntoView === 'function') {
            el.scrollIntoView({ block: 'center', behavior: 'smooth' });
          }
          setPendingScrollCourseKey(null);
        });
        return () => window.cancelAnimationFrame(id);
      }, [primaryView, selectedProgram, pendingScrollCourseKey, programView]);

      // adoption for every program at the selected term (for sidebar + dashboard)
      const programAdoption = useMemo(() => {
        if (!programs || !analytics || !selectedTerm) return {};
        const out = {};
        for (const p of programs) {
          const v = cachedProgramView(p, selectedTerm);
          out[p.name] = {
            pct: v.adoptionPct, reqTotal: v.reqTotal, reqZtc: v.reqZtc,
            units: v.unitsRequired, survey: v.avgSurvey, coCount: v.coCount,
            coursesWithData: v.coursesWithData, coursesTotal: v.coursesTotal,
            choiceCaveat: v.choiceCaveatAreas > 0
          };
        }
        return out;
      }, [programs, analytics, selectedTerm, programViewCache]);

      const programTypes = useMemo(() => {
        if (!programs) return [];
        return Array.from(new Set(programs.map(p => p.type))).sort();
      }, [programs]);

      const filteredPrograms = useMemo(() => {
        if (!programs) return [];
        let list = programs.filter(p => {
          const pct = programAdoption[p.name]?.pct;
          return (typeFilter === 'all' || p.type === typeFilter)
            && (search.trim() === '' || p.name.toLowerCase().includes(search.toLowerCase()))
            && pathwayAdoptionMatches(pct, pathwayAdoptionFilter);
        });
        if (selectedProgram && !list.some(p => p.name === selectedProgram)) {
          const sel = programs.find(p => p.name === selectedProgram);
          if (sel) list = [sel, ...list];
        }
        const a = (n) => programAdoption[n]?.pct;
        list = list.slice().sort((x, y) => {
          if (sortBy === 'name') return x.name.localeCompare(y.name);
          if (sortBy === 'units') return (programAdoption[y.name]?.units || 0) - (programAdoption[x.name]?.units || 0);
          return cmpNullLast(a(x.name), a(y.name), () => x.name.localeCompare(y.name));
        });
        return list;
      }, [programs, typeFilter, pathwayAdoptionFilter, search, sortBy, programAdoption, selectedProgram]);

      const recentTerms = useMemo(() => new Set(getRecentTerms(terms, 2)), [terms]);

      const allCourses = useMemo(() => {
        if (!analytics || !selectedTerm) return [];
        return Object.keys(analytics.index).sort().map(key => enrichCourseFromKey(key, analytics, selectedTerm));
      }, [analytics, selectedTerm]);

      const filteredCourses = useMemo(() => {
        const q = search.trim().toLowerCase();
        let list = allCourses.filter(c => {
          const label = `${c.subject}-${c.number} ${c.courseTitle || c.analyticsTitle || ''}`.toLowerCase();
          const statusOk = courseStatusMatches(c, courseStatusFilter);
          const searchOk = q === '' || label.includes(q);
          return statusOk && searchOk;
        });
        list = list.slice().sort((x, y) => {
          const byCode = () => `${x.subject}-${x.number}`.localeCompare(`${y.subject}-${y.number}`);
          if (sortBy === 'name') return byCode();
          if (sortBy === 'survey') return cmpNullLast(x.surveyPct, y.surveyPct, byCode);
          return cmpNullLast(x.ztcPct, y.ztcPct, byCode);
        });
        return list;
      }, [allCourses, courseStatusFilter, search, sortBy]);

      const activeCourse = useMemo(() => {
        if (!selectedCourseKey || !analytics || !selectedTerm) return null;
        return enrichCourseFromKey(selectedCourseKey, analytics, selectedTerm);
      }, [selectedCourseKey, analytics, selectedTerm]);

      // Keep a valid course selected in Courses view when filters change
      useEffect(() => {
        if (primaryView !== 'courses' || !filteredCourses.length) return;
        if (!selectedCourseKey || !filteredCourses.some(c => c.key === selectedCourseKey)) {
          setSelectedCourseKey(filteredCourses[0].key);
        }
      }, [primaryView, filteredCourses, selectedCourseKey]);

      // institution-wide stats (all active pathways — global dashboard)
      const institution = useMemo(() => {
        if (!programs) return null;
        const base = computeInstitutionStats(programs, programAdoption);
        let chaffeyZtcCourses = 0, coZtcCourses = 0, coursesOffered = 0;
        if (analytics && selectedTerm) {
          for (const key of Object.keys(analytics.index)) {
            const c = enrichCourseFromKey(key, analytics, selectedTerm);
            if (c.offered) {
              coursesOffered++;
              if (c.ztcPct !== null && c.ztcPct >= ZTC_THRESHOLDS.ZTC_MIN) chaffeyZtcCourses++;
              if (c.coZtc) coZtcCourses++;
            }
          }
        }
        return { ...base, chaffeyZtcCourses, coZtcCourses, coursesOffered };
      }, [programs, programAdoption, analytics, selectedTerm]);

      const choiceCaveatPathways = useMemo(
        () => (programs || []).filter(p => programAdoption[p.name]?.choiceCaveat).length,
        [programs, programAdoption]
      );
      const needsAttentionTotal = useMemo(() => {
        if (!programs) return 0;
        return programs.filter(p => {
          const pct = programAdoption[p.name]?.pct;
          return pct !== null && pct !== undefined && pct < PATHWAY_HIGH_MIN;
        }).length;
      }, [programs, programAdoption]);
      const needsAttention = useMemo(() => {
        if (!programs) return [];
        return programs
          .map(p => ({ name: p.name, type: p.type, ...programAdoption[p.name] }))
          .filter(p => p.pct !== null && p.pct !== undefined && p.pct < PATHWAY_HIGH_MIN)
          .sort((a, b) => a.pct - b.pct)
          .slice(0, 5);
      }, [programs, programAdoption]);

      // Trend: selected program's ZTC adoption + avg survey completion across all terms
      const programTrend = useMemo(() => {
        if (!activeProgram || !analytics || !terms.length) return null;
        const ztc = [], survey = [];
        for (const tm of terms) {
          const v = cachedProgramView(activeProgram, tm);
          ztc.push(v.adoptionPct);
          survey.push(v.avgSurvey);
        }
        return { labels: terms, ztc, survey };
      }, [activeProgram, analytics, terms, programViewCache]);

      // Trend: institution-wide average ZTC adoption + survey completion (all pathways)
      const institutionTrend = useMemo(() => {
        if (!institutionTrendWanted || !programs || !analytics || !terms.length) return null;
        const avg = [], survey = [], scored = [];
        for (const tm of terms) {
          let ztcSum = 0, ztcN = 0, surveySum = 0, surveyN = 0;
          for (const p of programs) {
            const v = cachedProgramView(p, tm);
            if (v.adoptionPct !== null) { ztcSum += v.adoptionPct; ztcN++; }
            if (v.avgSurvey !== null) { surveySum += v.avgSurvey; surveyN++; }
          }
          avg.push(ztcN ? Math.round(ztcSum / ztcN) : null);
          survey.push(surveyN ? Math.round(surveySum / surveyN) : null);
          scored.push(ztcN);
        }
        return { labels: terms, avg, survey, scored };
      }, [programs, analytics, terms, programViewCache, institutionTrendWanted]);

      const switchPrimaryView = (next) => {
        if (next !== 'program' && next !== 'courses') return;
        if ((primaryView === 'program' && next === 'courses') || (primaryView === 'courses' && next === 'program')) {
          setSearch('');
        }
        if (primaryView === 'program' && next !== 'program') setPathwayAdoptionFilter('all');
        if (primaryView === 'courses' && next !== 'courses') setCourseStatusFilter('all');
        if (next === 'courses' && sortBy === 'units') setSortBy('adoption');
        if (next === 'program' && sortBy === 'survey') setSortBy('adoption');
        setPrimaryView(next);
      };

      const toggleDashboard = () => {
        setDashboardOpen((open) => !open);
      };

      const closeDashboard = ({ restoreToggle = false } = {}) => {
        setDashboardOpen(false);
        window.requestAnimationFrame(() => {
          if (restoreToggle) dashboardToggleRef.current?.focus();
        });
      };

      const closeDashboardToReading = () => {
        setDashboardOpen(false);
        window.requestAnimationFrame(() => {
          document.getElementById('main-content')?.focus();
        });
      };

      const openInstitutionTrendDetail = () => {
        dashboardModalTriggerRef.current = document.activeElement;
        setDashboardModal({ type: 'institution-trend' });
      };

      const openDashboardExplainer = (detail) => {
        dashboardModalTriggerRef.current = document.activeElement;
        setDashboardModal({ type: 'explainer', ...detail });
      };

      const selectProgramFromDashboard = (name) => {
        setPathwayAdoptionFilter('all');
        setSelectedProgram(name);
        switchPrimaryView('program');
        closeDashboardToReading();
      };

      const navigateFromOverviewKpi = (action) => {
        setSearch('');
        if (action.view === 'program') {
          setTypeFilter('all');
          setPathwayAdoptionFilter(action.pathwayAdoptionFilter || 'all');
          setSortBy(action.sortBy || 'adoption');
          setCourseStatusFilter('all');
          const pctOf = (n) => programAdoption[n]?.pct;
          const list = programs.slice().filter(p => pathwayAdoptionMatches(programAdoption[p.name]?.pct, action.pathwayAdoptionFilter || 'all')).sort((x, y) => {
            if ((action.sortBy || 'adoption') === 'name') return x.name.localeCompare(y.name);
            return cmpNullLast(pctOf(x.name), pctOf(y.name), () => x.name.localeCompare(y.name));
          });
          if (list.length) setSelectedProgram(list[0].name);
          switchPrimaryView('program');
          closeDashboardToReading();
        } else {
          setPathwayAdoptionFilter('all');
          setTypeFilter('all');
          setCourseStatusFilter(action.courseStatusFilter || 'all');
          setSortBy('adoption');
          const list = allCourses.slice().filter(c => courseStatusMatches(c, action.courseStatusFilter || 'all')).sort((x, y) => cmpNullLast(x.ztcPct, y.ztcPct, () => `${x.subject}-${x.number}`.localeCompare(`${y.subject}-${y.number}`)));
          if (list.length) setSelectedCourseKey(list[0].key);
          switchPrimaryView('courses');
          closeDashboardToReading();
        }
      };

      const openProgramFromCourse = (programName, courseKey) => {
        setPathwayAdoptionFilter('all');
        setTypeFilter('all');
        setSearch('');
        setSelectedProgram(programName);
        setSelectedCourse(null);
        if (courseKey) setPendingScrollCourseKey(courseKey);
        jumpAnnounceRef.current = `Opened pathway: ${programName}`;
        switchPrimaryView('program');
      };

      // Reverse index: course key -> programs that include it (deduped by program name)
      // Placement labels come from export area/subgroup titles (not invented nesting).
      const courseProgramsByKey = useMemo(() => {
        const map = new Map();
        if (!programs) return map;
        const placementFor = (area, sg) => {
          const areaLabel = cleanTitle(area?.title);
          const sgLabel = cleanTitle(sg?.title);
          if (sgLabel && sgLabel !== areaLabel) return sgLabel;
          return areaLabel || '';
        };
        const add = (key, prog, placement) => {
          if (!key) return;
          if (!map.has(key)) map.set(key, new Map());
          const byName = map.get(key);
          if (!byName.has(prog.name)) {
            byName.set(prog.name, { name: prog.name, type: prog.type, placements: [] });
          }
          const entry = byName.get(prog.name);
          const label = cleanTitle(placement);
          if (label && !entry.placements.includes(label)) entry.placements.push(label);
        };
        for (const prog of programs) {
          for (const area of prog.areas || []) {
            for (const sg of area.subgroups || []) {
              const placement = placementFor(area, sg);
              for (const c of sg.courses || []) add(c.key, prog, placement);
              if (sg.options) {
                for (const opt of sg.options) {
                  // A general-education area pool is not a listing of this pathway's courses.
                  if (opt.pooled) continue;
                  for (const c of opt.courses || []) add(c.key, prog, placement);
                }
              }
            }
          }
        }
        return map;
      }, [programs]);

      const programsForCourseKey = (key) => {
        if (!key) return [];
        const byName = courseProgramsByKey.get(key);
        if (!byName) return [];
        return Array.from(byName.values())
          .map(p => ({ ...p, pct: programAdoption[p.name]?.pct ?? null }))
          .sort((a, b) => a.name.localeCompare(b.name));
      };

      const trendSummary = (labels, series) => labels.map((l, i) => {
        const parts = series.map(s => `${s.name} ${s.data[i] === null ? 'no data' : s.data[i] + '%'}`).join(', ');
        return `${l}: ${parts}`;
      }).join('; ');

      // ============================================================
      // LANDING (ZTC course dataset upload)
      // ============================================================
      if (!programs || !analytics) {

          <div className={`h-screen ${t.bg} ${t.text} flex flex-col overflow-hidden`}>

              <div className="flex items-center gap-3 mb-2">

              <p className={`${t.textMuted} mb-3`}>

              {loadedYears.length > 0 ? (
                <p className={`text-sm ${t.textMuted} mb-8`} data-catalog-years="true">
                  <span className="font-semibold">Academic catalog years included:</span> {loadedYears.map(yearLabel).join(', ')}
                </p>
              ) : (
                <p className={`text-sm font-medium mb-8 ${darkMode ? 'text-red-400' : 'text-red-700'}`} role="alert">
                  Catalog structure files not found. Open the app from its full folder (including data/).
                </p>
              )}

              {(error || restoreError) && (
                <div role="alert" className={`mb-6 flex items-start gap-2 rounded-lg border border-red-500/50 bg-red-500/10 p-4 text-sm ${darkMode ? 'text-red-300' : 'text-red-800'}`}>
                  <Icons.AlertCircle className="w-5 h-5 flex-shrink-0" aria-hidden="true" />

                    <span>{error || restoreError}</span>
                    {restoreError && (
                      <button type="button" onClick={clearRejectedSession}

                      </button>

                </div>
              )}

              <div className="sr-only" role="status" aria-live="polite">{landingAnnounce}</div>

              <div>
                <label {...uploadDropHandlers('anal')}
                  className={`cursor-pointer rounded-xl border-2 border-dashed ${uploadCardCls('anal', pendingAnalRows)} ${t.card} p-6 flex flex-col items-center text-center transition-colors`}>
                  {pendingAnalRows ? <Icons.CheckCircle className={`w-8 h-8 mb-2 ${darkMode ? 'text-green-400' : 'text-green-700'}`} aria-hidden="true" /> : <Icons.BarChart3 className={`w-8 h-8 mb-2 ${darkMode ? 'text-blue-400' : 'text-blue-700'}`} aria-hidden="true" />}
                  <div className="font-semibold mb-1">ZTC course dataset</div>
                  <div className={`text-xs ${t.textMuted} mb-3`}>ZTC adoption % &amp; survey completion by course &amp; term</div>
                  <div className={`text-xs font-medium ${pendingAnalRows ? (darkMode ? 'text-green-400' : 'text-green-700') : (darkMode ? 'text-blue-400' : 'text-blue-700')}`}>
                    {pendingAnalRows ? `Loaded · ${pendingAnalRows.length - 1} rows` : 'Choose CSV or drop file…'}
                  </div>
                  <input type="file" accept=".csv,text/csv" className="sr-only" aria-label="Upload Course Analytics CSV" onChange={handleAnalFile} />
                </label>
              </div>

              <button type="button"
                onClick={buildDataset}
                disabled={!pendingAnalRows || !catalogMeta || loading}
                className={`mt-6 w-full rounded-lg px-4 py-3 font-semibold transition-colors flex items-center justify-center gap-2 ${(!pendingAnalRows || !catalogMeta || loading) ? (darkMode ? 'bg-zinc-700 text-zinc-300 cursor-not-allowed' : 'bg-gray-300 text-gray-600 cursor-not-allowed') : 'bg-blue-600 hover:bg-blue-700 text-white'}`}>
                {loading ? <><Icons.Refresh className="w-5 h-5 animate-spin" aria-hidden="true" /> Building…</> : <>Build dashboard <Icons.ChevronRight className="w-5 h-5" aria-hidden="true" /></>}
              </button>

              <button type="button" onClick={() => setDarkMode(d => !d)} className={`mt-4 text-xs ${t.textMuted} hover:underline flex items-center gap-1 mx-auto`}>
                {darkMode ? <Icons.Sun className="w-4 h-4" aria-hidden="true" /> : <Icons.Moon className="w-4 h-4" aria-hidden="true" />} Toggle theme
              </button>
            </div>
            </div>
            <AppFooter t={t} />
          </div>
        );
      }

      // ============================================================
      // DASHBOARD VIEW
      // ============================================================
      const renderDashboard = () => {
        if (!institution) return null;
        const distro = [
          { label: 'Fully ZTC-able', range: '100%', hint: 'All requirements met with ZTC', n: institution.full, color: 'bg-green-600' },
          { label: 'High', range: '75–99%', hint: 'Most requirements met with ZTC', n: institution.high - institution.full, color: 'bg-amber-500' },
          { label: 'Partial', range: '51–74%', hint: 'Some requirements met with ZTC', n: institution.partial, color: 'bg-red-500' },
          { label: 'Low', range: '0–50%', hint: 'Few requirements met with ZTC', n: institution.low, color: 'bg-red-600' }

        const rankedAll = programs

        const ranked = rankedAll.slice(0, 5);
        const instSub = `${periodWord} ${periodLabel(selectedTerm)}`;
        const headlineAction = { view: 'program', pathwayAdoptionFilter: 'all', sortBy: 'name' };
        const overviewKpis = [
          { label: 'Fully ZTC-able', val: institution.full, sub: '100% of requirements', color: darkMode ? 'text-green-400' : 'text-green-700', title: 'Pathways where every scored requirement can be met with ZTC courses.', action: { view: 'program', pathwayAdoptionFilter: 'full', sortBy: 'adoption' }, meaning: 'Active pathways where every scored catalog requirement can be completed with a qualifying ZTC option.', calculation: `Counts scored pathways whose requirement-based ZTC adoption is 100% for ${periodLabel(selectedTerm)}. Unavailable or unknown required courses remain in the denominator as unmet.` },
          { label: '≥75% ZTC-able', val: institution.high, sub: institution.full > 0 ? `${institution.full} at 100%` : 'requirement-based', color: darkMode ? 'text-amber-400' : 'text-amber-800', title: 'Pathways at or above the 75% requirement-based adoption threshold.', action: { view: 'program', pathwayAdoptionFilter: 'high', sortBy: 'adoption' }, meaning: 'Active pathways where at least three quarters of scored catalog requirements can be completed with qualifying ZTC options.', calculation: `Counts scored pathways with requirement-based ZTC adoption of 75% or higher for ${periodLabel(selectedTerm)}; the count includes pathways at 100%.` },
          { label: 'Chaffey ZTC courses', val: institution.chaffeyZtcCourses, sub: `≥75% sections · of ${institution.coursesOffered} offered`, color: darkMode ? 'text-green-400' : 'text-green-700', title: 'Courses offered this term where at least 75% of sections are zero textbook cost (Chaffey ZTC threshold).', action: { view: 'courses', courseStatusFilter: 'ztc' }, meaning: 'Courses offered in the selected term that meet Chaffey’s ZTC threshold.', calculation: `Counts offered courses whose Course Analytics ZTC percentage is 75% or higher for ${periodLabel(selectedTerm)}. The denominator shown is all courses reported as offered that term.` },
          { label: "Chancellor's Office ZTC courses", val: institution.coZtcCourses, sub: `≥1 ZTC section · of ${institution.coursesOffered} offered`, color: darkMode ? 'text-violet-200' : 'text-violet-800', title: "Courses offered this term with at least one zero textbook cost section (Chancellor's Office ZTC threshold).", action: { view: 'courses', courseStatusFilter: 'co' }, meaning: 'Courses offered in the selected term with at least one section reported as zero textbook cost.', calculation: `Counts offered courses with one or more ZTC sections in Course Analytics for ${periodLabel(selectedTerm)}. The denominator shown is all courses reported as offered that term.` }
        ];
        const averageExplainer = {
          title: 'Average ZTC adoption',
          meaning: 'The institution-wide mean of active pathways’ requirement-based ZTC adoption for the selected term.',
          calculation: `For ${periodLabel(selectedTerm)}, the app calculates each pathway’s percentage of catalog requirements that can be met with qualifying ZTC options, averages the scored pathway percentages, and rounds to the nearest whole percent. Pathways with no scored requirements are excluded.`
        };
        const attentionExplainer = {
          title: 'Needs attention',
          meaning: 'The lowest-adoption active pathways below the partial-adoption threshold.',
          calculation: `Filters scored pathways below 75% requirement-based ZTC adoption for ${periodLabel(selectedTerm)}, sorts them from lowest to highest, and displays up to five. Unavailable or unknown required courses remain in each pathway denominator as unmet.`
        };
        const trendExplainer = {
          title: 'Adoption trend',
          meaning: 'How institution-wide pathway ZTC adoption changes across available terms.',
          calculation: 'For each term, the app calculates every active pathway’s requirement-based ZTC adoption, excludes pathways with no scored requirements, averages the remaining pathway percentages, and rounds to the nearest whole percent. The delta compares the selected term with the nearest earlier term that has data.'
        };
        const distributionExplainer = {
          title: 'Distribution by ZTC-ability',
          meaning: 'How scored active pathways are distributed across requirement-based ZTC adoption ranges.',
          calculation: 'Places each scored pathway into one exclusive range: 100%, 75–99%, 51–74%, or 0–50%. Each displayed percentage is the range count divided by all scored pathways for the selected term.'
        };
        const rankingExplainer = {
          title: 'Top pathways',
          meaning: 'The active pathways with the highest requirement-based ZTC adoption in the selected term.',
          calculation: 'Sorts scored pathways by ZTC adoption from highest to lowest, breaks ties alphabetically by pathway name, and displays the first five.'
        };
        let trendIndex = institutionTrend ? institutionTrend.labels.indexOf(selectedTerm) : -1;
        if (institutionTrend && trendIndex < 0) trendIndex = institutionTrend.labels.length - 1;
        const trendCurrent = institutionTrend && trendIndex >= 0 ? institutionTrend.avg[trendIndex] : null;
        let trendPrevious = null;
        if (institutionTrend) {
          for (let i = trendIndex - 1; i >= 0; i--) {
            if (institutionTrend.avg[i] !== null && institutionTrend.avg[i] !== undefined) {
              trendPrevious = institutionTrend.avg[i];
              break;
            }
          }
        }
        const trendDelta = trendCurrent !== null && trendPrevious !== null ? trendCurrent - trendPrevious : null;
        const deltaLabel = trendDelta === null
          ? 'No comparable prior term'
          : `${trendDelta > 0 ? '+' : ''}${trendDelta} point${Math.abs(trendDelta) === 1 ? '' : 's'} from prior term`;
        const distroSummary = distro.map(d => {
          const pct = institution.scored ? Math.round((d.n / institution.scored) * 100) : 0;
          return `${d.label} ${d.range}: ${d.n} pathways, ${pct}%`;
        }).join('; ');
        return (
          <>
            <div className={`flex-shrink-0 px-3 py-2.5 border-b ${t.headerBorder}`}>
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0">
                  <h2 id="dashboard-panel-title" className="text-sm font-bold tracking-tight">Dashboard</h2>
                  <p className={`text-xs ${t.textMuted} mt-0.5`}>Institution-wide ZTC · {programs.length} pathways · {periodLabel(selectedTerm)}</p>
                </div>
                <button type="button" onClick={() => closeDashboard({ restoreToggle: true })}
                  aria-label="Close Dashboard"
                  className={`min-w-[44px] min-h-[44px] p-2.5 rounded-lg flex-shrink-0 inline-flex items-center justify-center ${t.cardHover}`}>
                  <Icons.X className="w-4 h-4" aria-hidden="true" />
                </button>
              </div>
            </div>
            <div className="flex-1 min-h-0 overflow-y-auto overflow-x-hidden p-3 space-y-5">
              <DashboardSection compact title="Institution overview" subtitle={instSub}
                badge={<DashboardInfoButton label="Average ZTC adoption" t={t} onClick={() => openDashboardExplainer(averageExplainer)} />}>
                <div className="relative">
                  <button type="button" onClick={() => navigateFromOverviewKpi(headlineAction)}
                    aria-label={`Average ZTC adoption: ${institution.avg === null ? 'no scored data' : institution.avg + '%'}. ${institution.scored} of ${institution.total} active pathways scored. Open Pathway view.`}
                    className={`w-full rounded-xl border ${darkMode ? 'border-blue-500/45 bg-blue-500/10' : 'border-blue-300 bg-blue-50'} p-3 text-left ${t.cardHover}`}>
                    <span className={`block text-xs font-semibold uppercase tracking-wide ${t.textMuted}`}>Average ZTC adoption</span>
                    <span className={`block text-3xl font-bold mt-1 ${institution.avg === null ? t.faint : pathwayPctColor(institution.avg, darkMode)}`}>
                      {institution.avg === null ? '—' : institution.avg + '%'}
                    </span>
                    <span className={`block text-xs mt-1 ${t.textMuted}`}>{institution.scored} of {institution.total} active pathways scored</span>
                    {yearNote && <span className={`block text-xs mt-1 ${t.textMuted}`}>{yearNote}</span>}
                  </button>
                  {choiceCaveatPathways > 0 && (
                    <p className={`flex items-center gap-2 text-xs mt-2 px-1 ${darkMode ? 'text-amber-400' : 'text-amber-800'}`} data-unverified-note="dashboard">
                      <span>{choiceCaveatPathways} pathway{choiceCaveatPathways === 1 ? ' includes' : 's include'} an unverified section</span>
                      <DashboardInfoButton label="Unverified section" hint={UNVERIFIED_HINT} compact t={t}
                        onClick={() => openDashboardExplainer(UNVERIFIED_EXPLAINER)} />
                    </p>
                  )}
                </div>
              </DashboardSection>

              {needsAttention.length > 0 && (
                <div className={`rounded-xl border ${darkMode ? 'border-red-400/45 bg-red-500/10' : 'border-red-300 bg-red-50'} p-3`}>
                  <DashboardSection compact title="Needs attention" subtitle={`${needsAttentionTotal} of ${programs.length} below 75% ZTC`}
                    badge={<DashboardInfoButton label="Needs attention" t={t} onClick={() => openDashboardExplainer(attentionExplainer)} />}>
                    <div className="space-y-1.5">
                      {needsAttention.map(p => (
                        <button key={p.name} type="button"
                          onClick={() => selectProgramFromDashboard(p.name)}
                          aria-label={`${p.name}. ZTC adoption ${p.pct}%. Open pathway view.`}
                          className={`w-full min-h-[44px] flex items-center gap-2 rounded-lg border ${t.cardBorder} ${t.card} px-2.5 py-2 text-sm text-left ${t.cardHover} transition-colors`}>
                          <span className={`font-bold w-10 text-right tabular-nums flex-shrink-0 ${pathwayPctColor(p.pct, darkMode)}`}>{p.pct}%</span>
                          <span className="truncate">{p.name}</span>
                        </button>
                      ))}
                    </div>
                  </DashboardSection>
                </div>
              )}

              <DashboardSection compact title="Key counts" subtitle="Select a metric to open its filtered reading view">
                <div className="grid grid-cols-2 gap-2" style={{ gridAutoRows: '1fr' }}>
                  {overviewKpis.map((kpi, i) => (
                    <div key={i} className="relative" style={{ height: '100%' }}>
                      <button type="button" onClick={() => navigateFromOverviewKpi(kpi.action)}
                        aria-label={`${kpi.label}: ${kpi.val}. ${kpi.sub}. Open ${kpi.action.view === 'program' ? 'Pathway' : 'Courses'} view.`}
                        title={kpi.title}
                        style={{ height: '100%' }}
                        className={`w-full min-h-[72px] rounded-lg border ${t.cardBorder} ${t.card} pl-2.5 pr-10 py-2 text-left ${t.cardHover} transition-colors cursor-pointer`}>
                        <span className={`block text-xs font-semibold ${t.textMuted} leading-tight`}>{kpi.label}</span>
                        <span className={`block text-xl font-bold mt-0.5 ${kpi.color}`}>{kpi.val}</span>
                        <span className={`block text-xs ${t.faint} leading-snug mt-0.5`}>{kpi.sub}</span>
                      </button>
                      <span className="absolute top-1 right-1">
                        <DashboardInfoButton label={kpi.label} t={t}
                          onClick={() => openDashboardExplainer({ title: kpi.label, meaning: kpi.meaning, calculation: kpi.calculation })} />
                      </span>
                    </div>
                  ))}
                </div>
                {institution.noData > 0 && (
                  <p className={`text-xs ${t.textMuted} flex items-start gap-1.5`}>
                    <Icons.AlertCircle className="w-3.5 h-3.5 flex-shrink-0 mt-0.5" aria-hidden="true" />
                    <span>{institution.noData} pathway{institution.noData !== 1 ? 's' : ''} ha{institution.noData !== 1 ? 've' : 's'} no scored requirements for {periodLabel(selectedTerm)} (excluded from averages).</span>
                  </p>
                )}
              </DashboardSection>

              {institutionTrend && institutionTrend.avg.some(v => v !== null) && (
                <DashboardSection compact title="Adoption trend" subtitle="Institution-wide mean by term"
                  badge={<DashboardInfoButton label="Adoption trend" t={t} onClick={() => openDashboardExplainer(trendExplainer)} />}>
                  <div className={`rounded-xl border ${t.cardBorder} ${t.card} p-3`}>
                    <div className="flex items-end justify-between gap-3">
                      <div>
                        <p className={`text-xs ${t.textMuted}`}>{periodLabel(selectedTerm)}</p>
                        <p className="text-2xl font-bold">{trendCurrent === null ? '—' : trendCurrent + '%'}</p>
                      </div>
                      <p className={`text-xs text-right ${trendDelta === null ? t.textMuted : (trendDelta >= 0 ? (darkMode ? 'text-green-300' : 'text-green-800') : (darkMode ? 'text-red-300' : 'text-red-800'))}`}>
                        {deltaLabel}
                      </p>
                    </div>
                    <Sparkline data={institutionTrend.avg}
                      ariaLabel={`Institution-wide average ZTC adoption by term. ${trendSummary(institutionTrend.labels, [{ name: 'Average ZTC adoption', data: institutionTrend.avg }])}. ${deltaLabel}.`} />
                    <button type="button" onClick={openInstitutionTrendDetail}
                      className={`min-h-[44px] w-full rounded-lg border ${t.cardBorder} ${t.cardHover} px-3 py-2 text-sm font-semibold inline-flex items-center justify-center gap-2`}>
                      View trend details <Icons.ChevronRight className="w-4 h-4" aria-hidden="true" />
                    </button>
                  </div>
                </DashboardSection>
              )}

              <DashboardSection compact title="Compare pathways" subtitle={`${institution.scored} scored · requirement-based`}>
                <button type="button" onClick={() => setShowDashboardDetails(s => !s)}
                  aria-expanded={showDashboardDetails} aria-controls="dashboard-comparison-details"
                  className={`min-h-[44px] w-full rounded-lg border ${t.cardBorder} ${t.card} ${t.cardHover} px-3 py-2 text-sm font-semibold flex items-center justify-between gap-3`}>
                  <span>{showDashboardDetails ? 'Hide pathway details' : 'Explore pathway details'}</span>
                  <Icons.ChevronDown className={`w-4 h-4 transition-transform ${showDashboardDetails ? 'rotate-180' : ''}`} aria-hidden="true" />
                </button>
                {showDashboardDetails && (
                  <div id="dashboard-comparison-details" className="space-y-3">
                    <div className={`rounded-lg border ${t.cardBorder} ${t.card} p-3`}>
                      <div className="flex items-start justify-between gap-2 mb-2">
                        <h4 className="text-sm font-semibold">Distribution by ZTC-ability</h4>
                        <DashboardInfoButton label="Distribution by ZTC-ability" t={t}
                          onClick={() => openDashboardExplainer(distributionExplainer)} />
                      </div>
                      <div role="img" aria-label={`Distribution by ZTC-ability. ${distroSummary}.`}>
                        <div className={`h-4 rounded-full ${t.track} overflow-hidden flex`} aria-hidden="true">
                          {distro.map((d, i) => {
                            const pct = institution.scored ? (d.n / institution.scored) * 100 : 0;
                            return <span key={i} className={`h-full ${d.color}`} style={{ width: pct + '%' }}></span>;
                          })}
                        </div>
                        <div className="mt-3 space-y-1.5">
                          {distro.map((d, i) => {
                            const pct = institution.scored ? Math.round((d.n / institution.scored) * 100) : 0;
                            return (
                              <div key={i} className="flex items-center justify-between gap-2 text-xs">
                                <span className="flex items-center gap-2 min-w-0">
                                  <span className={`w-2.5 h-2.5 rounded-sm flex-shrink-0 ${d.color}`} aria-hidden="true"></span>
                                  <span className={t.textMuted}>{d.label} ({d.range})</span>
                                </span>
                                <span className="font-semibold whitespace-nowrap">{d.n} · {pct}%</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                    <div className={`rounded-lg border ${t.cardBorder} ${t.card} p-3`}>
                      <div className="flex items-start justify-between gap-2">
                        <h4 className="text-sm font-semibold">Top pathways</h4>
                        <DashboardInfoButton label="Top pathways" t={t}
                          onClick={() => openDashboardExplainer(rankingExplainer)} />
                      </div>
                      <p className={`text-xs ${t.textMuted} mb-2`}>Select a pathway to open it</p>
                      <div className="space-y-1">
                        {ranked.length === 0 ? (
                          <p className={`text-sm ${t.textMuted} px-1 py-3`}>No scored pathways for {periodLabel(selectedTerm)}.</p>

                          const surveyLabel = p.survey === null ? 'no survey data' : p.survey + '% survey completion';
                          return (
                            <button key={p.name} type="button"
                              onClick={() => selectProgramFromDashboard(p.name)}
                              aria-label={`${i + 1}. ${p.name}. ZTC adoption ${p.pct}%. ${surveyLabel}.`}
                              className={`w-full min-h-[44px] text-left flex items-center gap-2 rounded-lg px-2 py-2 ${t.cardHover} transition-colors ${p.name === selectedProgram ? (darkMode ? 'bg-blue-500/10 border border-blue-500/40' : 'bg-blue-50 border border-blue-200') : 'border border-transparent'}`}>
                              <span className={`text-xs font-bold w-4 flex-shrink-0 ${t.faint}`} aria-hidden="true">{i + 1}</span>
                              <span className="truncate text-sm flex-1 min-w-0">{p.name}</span>
                              <span className={`text-sm font-bold tabular-nums flex-shrink-0 ${pathwayPctColor(p.pct, darkMode)}`} aria-hidden="true">{p.pct}%</span>
                            </button>

                      </div>
                      {rankedAll.length > 5 && (
                        <button type="button"
                          onClick={() => navigateFromOverviewKpi({ view: 'program', pathwayAdoptionFilter: 'all', sortBy: 'adoption' })}
                          className={`mt-2 min-h-[44px] w-full rounded-lg border ${t.cardBorder} ${t.cardHover} px-3 py-2 text-sm font-semibold`}>
                          View all pathways
                        </button>
                      )}
                    </div>
                  </div>
                )}
              </DashboardSection>
            </div>
          </>

      };

      const renderDashboardModal = () => {
        if (!dashboardModal) return null;
        const isTrend = dashboardModal.type === 'institution-trend';

          <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 animate-fadeIn"
            onClick={(e) => { if (e.target === e.currentTarget) setDashboardModal(null); }}>
