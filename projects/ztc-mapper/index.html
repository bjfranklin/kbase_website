<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZTC Pathway Mapper</title>

  <!-- Tailwind CSS (offline — regenerate: scripts/generate-tailwind-css.sh) -->
  <link rel="stylesheet" href="vendor/tailwind.min.css">

  <!-- Vendored runtime (pinned — see vendor/deps.json; verify: scripts/check-deps.py) -->
  <!-- No crossorigin / no SRI integrity attrs: both break file:// opens; CI verifies sha384. -->
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <!-- Babel 7.x only: Babel 8 defaults preset-react to automatic JSX runtime,
       which emits `import {jsx} from "react/jsx-runtime"` and breaks UMD globals. -->
  <script src="vendor/babel.min.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/jspdf.plugin.autotable.min.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <script src="data/catalog-2023-2024.js"></script>
  <script src="data/catalog-2024-2025.js"></script>
  <script src="data/catalog-2025-2026.js"></script>
  <script src="data/catalog-2026-2027.js"></script>

  <script>
    // If index.html was opened without the vendor/ folder, show a clear error (not a blank page).
    (function () {
      var missing = [];
      if (typeof React === 'undefined') missing.push('React');
      if (typeof ReactDOM === 'undefined') missing.push('ReactDOM');
      if (typeof Babel === 'undefined') missing.push('Babel');
      if (!missing.length) return;
      var hosted = 'https://www.chairmanx.tech/projects/ztc-mapper/';
      var html = '<div role="alert" style="max-width:36rem;margin:2rem auto;padding:1.25rem 1.5rem;font-family:system-ui,sans-serif;line-height:1.5;color:#e4e4e7;background:#27272a;border:1px solid #52525b;border-radius:0.75rem">'
        + '<h1 style="margin:0 0 0.75rem;font-size:1.125rem;font-weight:700;color:#fafafa">ZTC Pathway Mapper — missing files</h1>'
        + '<p style="margin:0 0 0.75rem">This copy of <strong>index.html</strong> cannot run alone. Required libraries in the <code style="color:#93c5fd">vendor/</code> folder did not load'
        + (missing.length ? ' (' + missing.join(', ') + ').' : '.') + '</p>'
        + '<p style="margin:0 0 0.75rem"><strong>For most users:</strong> open the hosted app (includes all files):<br>'
        + '<a href="' + hosted + '" style="color:#60a5fa">' + hosted + '</a></p>'
        + '<p style="margin:0;font-size:0.875rem;color:#a1a1aa">Offline use: unzip or copy the <strong>entire</strong> <code>ztc-mapper</code> project folder, then open <code>index.html</code> from that folder.</p></div>';
      function show() {
        var el = document.getElementById('root');
        if (el) el.innerHTML = html;
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
      else show();
      window.__ZTC_VENDOR_MISSING__ = true;
    })();
  </script>

  <script>
    // Apply the saved theme before first paint to avoid a flash of the wrong theme.
    // Key must match STORAGE_KEY + '-theme' in the app script below.
    (function () {
      try {
        const theme = localStorage.getItem('ztc-pathway-mapper-v3-theme')
          || localStorage.getItem('ztc-pathway-mapper-v2-theme');
        if (theme === 'light') document.documentElement.classList.add('theme-light');
      } catch (e) { /* ignore */ }
    })();
  </script>
  <style>
    html { color-scheme: dark; }
    html.theme-light { color-scheme: light; }

    /* Theme-aware scrollbars (default = dark, graphite/zinc). Firefox uses scrollbar-color. */
    html { scrollbar-color: #52525b #18181b; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #52525b; border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: #71717a; }

    html.theme-light { scrollbar-color: #94a3b8 #e2e8f0; }
    html.theme-light ::-webkit-scrollbar-track { background: #e2e8f0; }
    html.theme-light ::-webkit-scrollbar-thumb { background: #94a3b8; }
    html.theme-light ::-webkit-scrollbar-thumb:hover { background: #64748b; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes scaleIn { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .animate-fadeIn { animation: fadeIn 0.18s ease-out; }
    .animate-scaleIn { animation: scaleIn 0.18s ease-out; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .animate-spin { animation: spin 1s linear infinite; }

    /* Strong, consistent focus indicator for keyboard users */
    *:focus-visible { outline: 3px solid #3b82f6; outline-offset: 2px; border-radius: 4px; }

    /* Visually-hidden but available to screen readers */
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }
    /* Skip link: hidden until focused */
    .skip-link {
      position: absolute; left: 8px; top: -48px; z-index: 100;
      background: #2563eb; color: #fff; padding: 8px 14px; border-radius: 8px;
      transition: top 0.15s ease; font-weight: 600;
    }
    .skip-link:focus { top: 8px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    /* Single scroll surface: prevent body overscroll past app shell */
    html, body { height: 100%; margin: 0; overflow: hidden; }
    #root { height: 100%; }

    /* Dashboard replaces only the left navigation column at tablet/desktop widths. */
    .sidebar-column { position: relative; overflow: hidden; }
    .sidebar-pane {
      position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0;
      transition: transform 200ms ease-out;
    }
    .sidebar-pane-nav.is-off { transform: translateX(-100%); }
    .sidebar-pane-dash.is-off { transform: translateX(100%); }
    .sidebar-pane.is-inactive { visibility: hidden; pointer-events: none; }
    .dashboard-tab-rail {
      width: 2.75rem; flex: 0 0 2.75rem; display: flex; align-items: flex-start;
      justify-content: center; padding-top: 1rem; position: relative; z-index: 20;
    }
    .dashboard-pullout-tab {
      width: 100%; min-height: 4.5rem; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0.5rem;
      border-radius: 0 0.75rem 0.75rem 0; border-left: 4px solid transparent;
      position: relative; transition: background-color 160ms ease, border-color 160ms ease;
    }
    .dashboard-pullout-tab.is-open { border-left-color: #3b82f6; }
    .dashboard-tab-label {
      position: absolute; left: calc(100% + 0.5rem); top: 50%; transform: translateY(-50%);
      z-index: 30; opacity: 0; pointer-events: none; white-space: nowrap;
      padding: 0.35rem 0.55rem; border-radius: 0.5rem; font-size: 0.75rem;
      background: #27272a; color: #f4f4f5; border: 1px solid #52525b;
      box-shadow: 0 8px 20px rgba(0,0,0,0.22);
      transition: opacity 140ms ease;
    }
    html.theme-light .dashboard-tab-label {
      background: #fff; color: #1a1a1a; border-color: #d1d5db;
    }
    .dashboard-pullout-tab:hover .dashboard-tab-label,
    .dashboard-pullout-tab:focus-visible .dashboard-tab-label { opacity: 1; }
    @media (max-width: 639px) {
      .app-layout.dashboard-primary-canvas .sidebar-column {
        width: calc(100vw - 2.75rem);
        flex-basis: calc(100vw - 2.75rem);
      }
      .app-layout.dashboard-primary-canvas .reading-pane {
        flex: 0 0 0;
        width: 0;
        min-width: 0;
        visibility: hidden;
        overflow: hidden;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ============================================================
    // ICONS
    // ============================================================
    const Icon = (paths) => (props) => (
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" strokeWidth="2"
        strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" {...props}>
        {paths}
      </svg>
    );
    const Icons = {
      Download: Icon(<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></>),
      Search: Icon(<><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></>),
      X: Icon(<><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></>),
      Check: Icon(<><polyline points="20 6 9 17 4 12"></polyline></>),
      CheckCircle: Icon(<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></>),
      AlertCircle: Icon(<><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></>),
      Sun: Icon(<><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></>),
      Moon: Icon(<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>),
      BarChart3: Icon(<><path d="M3 3v18h18"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></>),
      Landmark: Icon(<><line x1="3" y1="22" x2="21" y2="22"></line><line x1="6" y1="18" x2="6" y2="11"></line><line x1="10" y1="18" x2="10" y2="11"></line><line x1="14" y1="18" x2="14" y2="11"></line><line x1="18" y1="18" x2="18" y2="11"></line><polygon points="12 2 20 7 4 7"></polygon></>),
      BookOpen: Icon(<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></>),
      ChevronRight: Icon(<polyline points="9 18 15 12 9 6"></polyline>),
      ChevronLeft: Icon(<polyline points="15 18 9 12 15 6"></polyline>),
      ChevronDown: Icon(<polyline points="6 9 12 15 18 9"></polyline>),
      Refresh: Icon(<><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></>),
      FileText: Icon(<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></>),
      Shield: Icon(<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"></path><path d="m9 12 2 2 4-4"></path></>),
      LineChart: Icon(<><path d="M3 3v18h18"></path><path d="m7 12 4-4 4 4 6-6"></path></>)
    };

    // PRODUCTION MODEL TEST START
    // ============================================================
    // CONSTANTS
    // ============================================================
    // ZTC_MIN/PARTIAL_MIN = Chaffey internal adoption thresholds (% of sections).
    // CO_MIN_SECTIONS = Chancellor's Office definition: ZTC-passing with >=1 ZTC section.
    const ZTC_THRESHOLDS = { ZTC_MIN: 75, PARTIAL_MIN: 51, CO_MIN_SECTIONS: 1 };
    const STORAGE_KEY = 'ztc-pathway-mapper-v3';
    const UI_STORAGE_KEY = STORAGE_KEY + '-ui';
    const DATASET_SCHEMA_VERSION = 3;
    const UI_SCHEMA_VERSION = 1;
    const COURSE_CATALOG_URL = 'https://colss-prod.ec.chaffey.edu/Student/Courses/Search?keyword=';
    const APP_HOSTED_URL = 'https://www.chairmanx.tech/projects/ztc-mapper/';
    const APP_META = {
      contact: 'Bradley Franklin',
      department: 'Instructional Systems & Pathways Innovation',
      useLine: 'Internal — ZTC / OER',
      accessibility: 'WCAG 2.1 Level AA',
      a11yNote: 'Status labels include text, not color alone.',
      hostedUrl: APP_HOSTED_URL
    };

    const isPlainObject = (value) =>
      value !== null && typeof value === 'object' && !Array.isArray(value);

    const validatePersistedDataset = (value) => {
      if (!isPlainObject(value)) throw new Error('Saved data is not an object.');
      // Schema 3 (v4.0): pathway structure comes from the official catalog files, so
      // earlier and schema-less sessions must be reloaded.
      if (value.schemaVersion !== DATASET_SCHEMA_VERSION) {
        throw new Error(`Saved data uses unsupported schema version ${value.schemaVersion === undefined ? '(none)' : value.schemaVersion}. Load the ZTC dataset again.`);
      }
      if (!Array.isArray(value.programs) || value.programs.length === 0) {
        throw new Error('Saved data has no active pathways.');
      }
      if (value.programs.some(p =>
        !isPlainObject(p) || typeof p.name !== 'string' || !p.name.trim() || !Array.isArray(p.areas)
      )) {
        throw new Error('Saved pathway data is incomplete.');
      }
      if (!isPlainObject(value.analytics) || !isPlainObject(value.analytics.index)) {
        throw new Error('Saved course analytics are incomplete.');
      }
      if (!Array.isArray(value.terms) || value.terms.length === 0 ||
          value.terms.some(term => typeof term !== 'string' || !term.trim())) {
        throw new Error('Saved data has no valid terms.');
      }
      const selectedTerm = value.terms.includes(value.selectedTerm)
        ? value.selectedTerm
        : value.terms[value.terms.length - 1];
      // `type` is derived from the name at parse time; re-derive it when a
      // saved payload lacks it so `undefined` never reaches the type filter.
      const programs = value.programs.map(p =>
        typeof p.type === 'string' && p.type.trim() ? p : { ...p, type: programType(p.name) }
      );
      return {
        schemaVersion: DATASET_SCHEMA_VERSION,
        programs,
        analytics: value.analytics,
        terms: value.terms,
        selectedTerm,
        savedAt: typeof value.savedAt === 'string' ? value.savedAt : null
      };
    };

    const validatePersistedUiState = (value, dataset) => {
      const programNames = new Set(dataset.programs.map(p => p.name));
      const courseKeys = new Set(Object.keys(dataset.analytics.index));
      const validPathwayFilters = new Set(['all', 'full', 'high', 'partial', 'low', 'no-data']);
      const validCourseFilters = new Set(COURSE_STATUS_OPTIONS.map(option => option.value));
      const validSorts = new Set([...SORT_BY_OPTIONS, ...COURSE_SORT_OPTIONS].map(option => option.value));
      const fallback = {
        selectedTerm: dataset.selectedTerm,
        selectedYear: dataset.selectedYear || defaultYear(dataset.terms),
        selectedProgram: dataset.programs[0]?.name || null,
        selectedCourseKey: Array.from(courseKeys).sort()[0] || null,
        primaryView: 'program',
        search: '',
        typeFilter: 'all',
        pathwayAdoptionFilter: 'all',
        courseStatusFilter: 'all',
        sortBy: 'adoption',
        dashboardOpen: false
      };
      if (!isPlainObject(value) ||
          (value.schemaVersion !== undefined && value.schemaVersion !== UI_SCHEMA_VERSION)) {
        return fallback;
      }
      const programTypes = new Set(dataset.programs.map(p => p.type));
      return {
        selectedTerm: dataset.terms.includes(value.selectedTerm) ? value.selectedTerm : fallback.selectedTerm,
        selectedYear: fallback.selectedYear,
        selectedProgram: programNames.has(value.selectedProgram) ? value.selectedProgram : fallback.selectedProgram,
        selectedCourseKey: courseKeys.has(value.selectedCourseKey) ? value.selectedCourseKey : fallback.selectedCourseKey,
        primaryView: value.primaryView === 'courses' ? 'courses' : 'program',
        search: typeof value.search === 'string' ? value.search.slice(0, 200) : '',
        typeFilter: value.typeFilter === 'all' || programTypes.has(value.typeFilter) ? value.typeFilter : 'all',
        pathwayAdoptionFilter: validPathwayFilters.has(value.pathwayAdoptionFilter) ? value.pathwayAdoptionFilter : 'all',
        courseStatusFilter: validCourseFilters.has(value.courseStatusFilter) ? value.courseStatusFilter : 'all',
        sortBy: validSorts.has(value.sortBy) ? value.sortBy : 'adoption',
        dashboardOpen: value.dashboardOpen === true
      };
    };

    const csvEscape = (value) => {
      let cell = String(value ?? '');
      if (/^[=+\-@\t\r]/.test(cell)) cell = `'${cell}`;
      return /[",\n\r]/.test(cell) ? `"${cell.replace(/"/g, '""')}"` : cell;
    };

    const CHOICE_CAVEAT_TEXT = 'the structure read from the catalog could not be confirmed against the units the catalog prints, so its requirements may be mis-scored or left out of the percentage. Check this pathway in the catalog.';
    // Shown from the "i" beside every unverified-section note.
    const UNVERIFIED_HINT = 'Unverified section: what the app read from the catalog for this section does not add up to the units the catalog prints for it. Select for details.';
    const UNVERIFIED_EXPLAINER = {
      title: 'Unverified section',
      meaningTitle: 'What this means',
      calculationTitle: 'How it is decided',
      meaning: 'A section is one requirement block of a pathway in the catalog, such as "Required Core" or "List A". "Unverified" means the app could not confirm that it read that block\u2019s requirements correctly, so the pathway\u2019s percentage may be off. It says nothing about the courses themselves or their ZTC status.',
      calculation: 'For every block, the app adds up the units of the requirements it read from the catalog export and compares the result with the units the catalog prints for that block. If the two do not match, or the catalog prints no units for the block, the section is marked unverified. It is still scored as read. A section marked "listed but not scored" could not be read into requirements at all: its courses are shown and it is left out of the percentage. Check the pathway in the catalog before relying on its score.'
    };
    const programExportCaveat = (program, view) => {
      const notes = [];
      if (view?.choiceCaveatAreas > 0) {
        notes.push(`In ${view.choiceCaveatAreas} section${view.choiceCaveatAreas === 1 ? '' : 's'} ${CHOICE_CAVEAT_TEXT}`);
      }
      return notes.join(' ');
    };

    const buildProgramCsv = (program, view, term) => {
      if (!program || !view) return '';
      const rows = [[
        'Program', 'Area', 'Sub-area', 'Option Group', 'Course', 'Course Title', 'Units',
        'Lab (*)', 'Term', 'ZTC %', 'Survey %',
        'Chaffey ZTC (75%+)', 'CO ZTC (1+ section)', 'Status', 'Export Note'
      ]];
      const caveat = programExportCaveat(program, view);
      const pushCourse = (area, subgroup, optionLabel, course) => {
        rows.push([
          program.name, area.title, subgroup.title || '', optionLabel || '',
          `${course.subject}-${course.number}`, course.courseTitle || course.analyticsTitle || '',
          course.units ?? '', course.headerId || '',
          term, course.ztcPct ?? '', course.surveyPct ?? '',
          course.status === 'ztc' ? 'Yes' : 'No', course.coZtc ? 'Yes' : 'No',
          course.status, caveat
        ]);
      };
      for (const area of view.areas) {
        for (const subgroup of area.subgroups) {
          if (subgroup.options?.length) {
            for (const option of subgroup.options) {
              for (const course of option.courses) pushCourse(area, subgroup, option.label || '', course);
            }
          } else {
            for (const course of subgroup.courses) pushCourse(area, subgroup, '', course);
          }
        }
      }
      return rows.map(row => row.map(csvEscape).join(',')).join('\n') + '\n';
    };

    const SORT_BY_OPTIONS = [
      { value: 'adoption', label: 'ZTC %' },
      { value: 'name', label: 'Name' },
      { value: 'units', label: 'Units' }
    ];
    const COURSE_SORT_OPTIONS = [
      { value: 'adoption', label: 'ZTC %' },
      { value: 'name', label: 'Name' },
      { value: 'survey', label: 'Survey %' }
    ];
    const COURSE_STATUS_OPTIONS = [
      { value: 'all', label: 'All statuses' },
      { value: 'ztc', label: 'ZTC' },
      { value: 'co', label: 'CO ZTC' },
      { value: 'partial', label: 'Partial' },
      { value: 'not-ztc', label: 'Not ZTC' },
      { value: 'no-data', label: 'No data' }
    ];

    const THEME = {
      dark: {
        bg: 'bg-zinc-950', text: 'text-zinc-100', textMuted: 'text-zinc-300', faint: 'text-zinc-400',
        header: 'bg-zinc-900/95', headerBorder: 'border-zinc-800',
        card: 'bg-zinc-800/50', cardHover: 'hover:bg-zinc-800', cardBorder: 'border-zinc-700/60',
        panel: 'bg-zinc-900', panelBorder: 'border-zinc-800',
        input: 'bg-zinc-800 border-zinc-700 text-zinc-100', divider: 'border-zinc-800',
        chip: 'bg-zinc-800 text-zinc-200', sidebar: 'bg-zinc-900/60', track: 'bg-zinc-700/50'
      },
      light: {
        bg: 'bg-gray-50', text: 'text-gray-900', textMuted: 'text-gray-600', faint: 'text-gray-600',
        header: 'bg-white/95', headerBorder: 'border-gray-200',
        card: 'bg-white', cardHover: 'hover:bg-gray-50', cardBorder: 'border-gray-200',
        panel: 'bg-white', panelBorder: 'border-gray-200',
        input: 'bg-white border-gray-300 text-gray-900', divider: 'border-gray-200',
        chip: 'bg-gray-200 text-gray-800', sidebar: 'bg-gray-100/60', track: 'bg-gray-200'
      }
    };

    // ============================================================
    // UTILITIES
    // ============================================================
    // Lenient percentage/unit parsing for CSV cells: strips "%" and ",", null on blank/NaN.
    const parseNum = (v) => {
      if (v === null || v === undefined || v === '') return null;
      const s = String(v).replace(/[%,]/g, '');
      const n = parseFloat(s);
      return Number.isNaN(n) ? null : n;
    };
    const parsePct = (v) => parseNum(v);
    const parseUnits = (v) => parseNum(v);
    const parseCount = (v) => {
      if (v === null || v === undefined || String(v).trim() === '') return null;
      const s = String(v).trim().replace(/,/g, '');
      if (!/^\+?\d+(?:\.\d+)?$/.test(s)) return null;
      const n = Number(s);
      return Number.isSafeInteger(n) && n >= 0 ? n : null;
    };
    const fmtUnits = (n) => (n === null || n === undefined) ? '' : (Math.round(n * 100) / 100).toString();

    // Robust CSV parser: handles quoted fields with embedded commas + newlines.
    // Slices fields out of the source text instead of appending one character at a
    // time; output is identical to the previous character-append parser.
    const parseCSV = (text) => {
      if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
      const rows = [];
      let row = [];
      const n = text.length;
      let i = 0;
      const pushRow = () => {
        if (row.length > 1 || (row.length === 1 && row[0].trim() !== '')) rows.push(row);
        row = [];
      };
      const isDelimiter = (c) => c === 44 || c === 10 || c === 13; // , \n \r
      while (i < n) {
        let field;
        if (text.charCodeAt(i) === 34) { // field opens with a quote
          let j = i + 1, start = j, parts = null;
          for (;;) {
            const q = text.indexOf('"', j);
            if (q === -1) { j = n; break; }
            if (text.charCodeAt(q + 1) === 34) { // escaped quote
              (parts = parts || []).push(text.slice(start, q + 1));
              start = j = q + 2;
              continue;
            }
            j = q;
            break;
          }
          field = parts ? parts.join('') + text.slice(start, j) : text.slice(start, j);
          i = j + 1;
          let k = i; // lenient: text after the closing quote stays in the field
          while (k < n && !isDelimiter(text.charCodeAt(k))) k++;
          if (k > i) { field += text.slice(i, k).replace(/"/g, ''); i = k; }
        } else {
          let k = i;
          while (k < n && !isDelimiter(text.charCodeAt(k))) k++;
          field = text.slice(i, k);
          i = k;
        }
        if (field.indexOf('\r') !== -1) field = field.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        row.push(field);
        const c = text.charCodeAt(i);
        if (c === 44) { i++; if (i === n) { row.push(''); pushRow(); } continue; }
        if (c === 13) { i += text.charCodeAt(i + 1) === 10 ? 2 : 1; pushRow(); continue; }
        if (c === 10) { i++; pushRow(); continue; }
      }
      if (row.length) pushRow();
      return rows;
    };

    // Term ordering: YYYY/SP, YYYY/SU, YYYY/FA
    const SEM_ORDER = { SP: 0, SU: 1, FA: 2 };
    const termRank = (t) => {
      const m = String(t || '').trim().match(/^(\d{4})\/(SP|SU|FA)$/i);
      if (!m) return -1;
      return parseInt(m[1], 10) * 10 + (SEM_ORDER[m[2].toUpperCase()] ?? 9);
    };
    const sortTerms = (terms) => terms.slice().sort((a, b) => termRank(a) - termRank(b));
    const getRecentTerms = (terms, count = 2) => sortTerms(terms).slice(-count);
    // Jan-May = SP, Jun-Jul = SU, Aug-Dec = FA.
    const currentTermCode = (now = new Date()) => {
      const month = now.getMonth() + 1;
      const sem = month <= 5 ? 'SP' : (month <= 7 ? 'SU' : 'FA');
      return `${now.getFullYear()}/${sem}`;
    };
    // Open on the latest term that is not in the future; fall back to the latest term.
    const defaultTerm = (terms, now = new Date()) => {
      const sorted = sortTerms(terms || []);
      const current = termRank(currentTermCode(now));
      let pick = '';
      for (const term of sorted) {
        const rank = termRank(term);
        if (rank !== -1 && rank <= current) pick = term;
      }
      return pick || sorted[sorted.length - 1] || '';
    };

    // ---- Academic years ----
    // Pathways are scored over an academic year (Fall -> Spring -> Summer) against that
    // year's catalog. "2026-2027" is 2026/FA, 2027/SP and 2027/SU.
    const ACADEMIC_YEAR_SURVEY_MIN = 90;
    const isYearKey = (value) => /^\d{4}-\d{4}$/.test(String(value || ''));
    const yearLabel = (yearKey) => isYearKey(yearKey) ? `${yearKey.slice(0, 4)}\u2013${yearKey.slice(7)}` : String(yearKey || '');
    const periodLabel = (value) => isYearKey(value) ? yearLabel(value) : String(value || '');
    const academicYearTerms = (yearKey) => {
      const [start, end] = String(yearKey).split('-');
      return [`${start}/FA`, `${end}/SP`, `${end}/SU`];
    };
    const yearOfTerm = (term) => {
      const m = String(term || '').trim().match(/^(\d{4})\/(SP|SU|FA)$/i);
      if (!m) return '';
      const year = parseInt(m[1], 10);
      return m[2].toUpperCase() === 'FA' ? `${year}-${year + 1}` : `${year - 1}-${year}`;
    };
    const loadedCatalogs = () => (typeof window !== 'undefined' && window.ZTC_CATALOGS) || {};
    const catalogYears = () => Object.keys(loadedCatalogs()).filter(isYearKey).sort();
    const catalogsSha = () => catalogYears().map(y => loadedCatalogs()[y]?.meta?.sourceSha256 || '').join(':') || null;
    // Open on the academic year of the default term when its catalog is loaded; else the latest.
    const defaultYear = (terms, now = new Date()) => {
      const years = catalogYears();
      const wanted = yearOfTerm(defaultTerm(terms, now));
      return years.includes(wanted) ? wanted : (years[years.length - 1] || '');
    };
    // A course's record for an academic year. Departments commit at the section level
    // for each term, so the year is only as good as its weakest term: `ztcPct` is the
    // lowest term percentage, which makes the 75% rule mean "75%+ in every term offered".
    const yearRecordCache = new WeakMap();
    const yearRecord = (rec, yearKey) => {
      let byYear = yearRecordCache.get(rec);
      if (!byYear) { byYear = {}; yearRecordCache.set(rec, byYear); }
      if (yearKey in byYear) return byYear[yearKey];
      const offered = academicYearTerms(yearKey).filter(term => rec.terms[term]).map(term => ({ term, ...rec.terms[term] }));
      let record = null;
      if (offered.length) {
        const sum = (field) => offered.every(x => x[field] === null || x[field] === undefined)
          ? null : offered.reduce((total, x) => total + (x[field] || 0), 0);
        const totalSec = sum('totalSec');
        const surveysSub = sum('surveysSub');
        let surveyPct = null;
        if (totalSec && surveysSub !== null) surveyPct = Math.round((surveysSub / totalSec) * 10000) / 100;
        else {
          const known = offered.filter(x => x.surveyPct !== null && x.surveyPct !== undefined);
          if (known.length) surveyPct = Math.round((known.reduce((a, x) => a + x.surveyPct, 0) / known.length) * 100) / 100;
        }
        record = {
          ztcPct: Math.min(...offered.map(x => x.ztcPct === null || x.ztcPct === undefined ? 0 : x.ztcPct)),
          surveyPct,
          surveysSub,
          surveysPend: sum('surveysPend'),
          totalSec,
          ztcSec: sum('ztcSec'),
          ztca: null, ztcc: null, ztce: null, ztcf: null, ztcg: null, lct: null,
          yearTerms: offered.map(x => ({ term: x.term, ztcPct: x.ztcPct, totalSec: x.totalSec, ztcSec: x.ztcSec, surveyPct: x.surveyPct })),
          missedTerms: offered.filter(x => !(x.ztcPct >= ZTC_THRESHOLDS.ZTC_MIN)).map(x => x.term)
        };
      }
      byYear[yearKey] = record;
      return record;
    };
    // Survey completion for a year and whether it is still in progress: a term that is
    // missing from the dataset, or below 90% survey completion, keeps the year open.
    const yearStatus = (analytics, datasetTerms, yearKey) => {
      const have = new Set(datasetTerms || []);
      let allSections = 0, allSubmitted = 0;
      const terms = academicYearTerms(yearKey).map(term => {
        if (!have.has(term)) return { term, present: false, surveyPct: null };
        let sections = 0, submitted = 0, pctSum = 0, pctCount = 0, counted = true;
        for (const rec of Object.values(analytics.index)) {
          const m = rec.terms[term];
          if (!m) continue;
          if (m.totalSec === null || m.totalSec === undefined || m.surveysSub === null || m.surveysSub === undefined) counted = false;
          sections += m.totalSec || 0;
          submitted += m.surveysSub || 0;
          if (m.surveyPct !== null && m.surveyPct !== undefined) { pctSum += m.surveyPct; pctCount += 1; }
        }
        const surveyPct = counted && sections > 0
          ? Math.round((submitted / sections) * 100)
          : (pctCount ? Math.round(pctSum / pctCount) : null);
        if (counted) { allSections += sections; allSubmitted += submitted; }
        return { term, present: true, surveyPct };
      });
      const present = terms.filter(x => x.present);
      const surveyPct = allSections > 0
        ? Math.round((allSubmitted / allSections) * 100)
        : (present.length && present.every(x => x.surveyPct !== null)
          ? Math.round(present.reduce((a, x) => a + x.surveyPct, 0) / present.length) : null);
      const open = terms.filter(x => !x.present || x.surveyPct === null || x.surveyPct < ACADEMIC_YEAR_SURVEY_MIN);
      return {
        yearKey, terms, surveyPct,
        inProgress: open.length > 0,
        reason: open.map(x => x.present ? `${x.term} surveys at ${x.surveyPct === null ? 'unknown' : x.surveyPct + '%'}` : `${x.term} not in the dataset yet`).join('; ')
      };
    };

    // Normalize a SUBJECT-NUMBER join key
    const normKey = (subject, number) => {
      const s = String(subject || '').trim().toUpperCase().replace(/\s+/g, '');
      const n = String(number || '').trim().toUpperCase().replace(/\s+/g, '');
      if (!s || !n) return '';
      return `${s}-${n}`;
    };
    const normCourseField = (v) => String(v || '').trim().toUpperCase().replace(/\s+/g, '');
    const parseCourseKey = (key) => {
      const idx = key.lastIndexOf('-');
      if (idx <= 0) return { subject: key, number: '' };
      return { subject: key.slice(0, idx), number: key.slice(idx + 1) };
    };

    // Header lookup helpers
    const findIdx = (headers, candidates) => {
      const norm = headers.map(h => String(h).trim().toLowerCase());
      for (const cand of candidates) {
        const i = norm.indexOf(cand.toLowerCase());
        if (i !== -1) return i;
      }
      for (const cand of candidates) {
        const i = norm.findIndex(h => h.includes(cand.toLowerCase()));
        if (i !== -1) return i;
      }
      return -1;
    };

    // ZTC status from adoption percentage
    const ztcStatus = (pct) => {
      if (pct === null || pct === undefined) return 'no-data';
      if (pct >= ZTC_THRESHOLDS.ZTC_MIN) return 'ztc';
      if (pct >= ZTC_THRESHOLDS.PARTIAL_MIN) return 'partial';
      return 'not-ztc';
    };
    // Theme-aware so colored numbers meet >=4.5:1 contrast on light backgrounds too.
    const pctColor = (pct, dark = true) => {
      if (pct === null || pct === undefined) return dark ? 'text-zinc-400' : 'text-gray-600';
      if (pct >= ZTC_THRESHOLDS.ZTC_MIN) return dark ? 'text-green-400' : 'text-green-800';
      if (pct >= ZTC_THRESHOLDS.PARTIAL_MIN) return dark ? 'text-amber-400' : 'text-amber-800';
      return dark ? 'text-red-400' : 'text-red-800';
    };
    const ringColor = (pct) => {
      if (pct === null || pct === undefined) return '#64748b';
      if (pct >= ZTC_THRESHOLDS.ZTC_MIN) return '#22c55e';
      if (pct >= ZTC_THRESHOLDS.PARTIAL_MIN) return '#f59e0b';
      return '#ef4444';
    };
    const barColor = (pct) => {
      if (pct === null || pct === undefined) return 'bg-slate-500';
      if (pct >= ZTC_THRESHOLDS.ZTC_MIN) return 'bg-green-500';
      if (pct >= ZTC_THRESHOLDS.PARTIAL_MIN) return 'bg-amber-500';
      return 'bg-red-500';
    };
    // Pathways (and their sections) follow a stricter rule than courses: green only when
    // every requirement can be met with a Chaffey ZTC course (100%), yellow at 75-99%,
    // red below 75%. Course-level colours above are unchanged.
    const PATHWAY_HIGH_MIN = 75;
    const pathwayTone = (pct) => {
      if (pct === null || pct === undefined) return 'none';
      if (pct >= 100) return 'full';
      return pct >= PATHWAY_HIGH_MIN ? 'high' : 'low';
    };
    const pathwayPctColor = (pct, dark = true) => ({
      none: dark ? 'text-zinc-400' : 'text-gray-600',
      full: dark ? 'text-green-400' : 'text-green-800',
      high: dark ? 'text-amber-400' : 'text-amber-800',
      low: dark ? 'text-red-400' : 'text-red-800'
    })[pathwayTone(pct)];
    const pathwayRingColor = (pct) =>
      ({ none: '#64748b', full: '#22c55e', high: '#f59e0b', low: '#ef4444' })[pathwayTone(pct)];
    const pathwayBarColor = (pct) =>
      ({ none: 'bg-slate-500', full: 'bg-green-500', high: 'bg-amber-500', low: 'bg-red-500' })[pathwayTone(pct)];
    // Border + tint for the big stat card, keyed on ZTC status (no-data renders red, matching legacy behavior).
    const statusBorderCls = (pct) => {
      const s = ztcStatus(pct);
      if (s === 'ztc') return 'border-green-500/40 bg-green-500/10';
      if (s === 'partial') return 'border-amber-500/40 bg-amber-500/10';
      return 'border-red-500/40 bg-red-500/10';
    };
    // Descending numeric compare with nulls last; ties defer to tie().
    const cmpNullLast = (ax, ay, tie) => {
      if (ax == null && ay == null) return tie();
      if (ax == null) return 1;
      if (ay == null) return -1;
      return ay - ax;
    };

    const pathwayAdoptionMatches = (pct, filter) => {
      if (filter === 'all') return true;
      if (filter === 'scored') return pct !== null && pct !== undefined;
      if (filter === 'full') return pct === 100;
      if (filter === 'high') return pct !== null && pct !== undefined && pct >= ZTC_THRESHOLDS.ZTC_MIN;
      return true;
    };

    const courseStatusMatches = (c, filter) => {
      if (filter === 'all') return true;
      if (filter === 'co') return c.coZtc;
      return c.status === filter;
    };

    const PATHWAY_ADOPTION_FILTER_LABELS = {
      scored: 'Scored pathways',
      full: '100% adoption',
      high: '≥75% adoption'
    };

    // Program type classification (from program title)
    const programType = (name) => {
      const n = (name || '').toLowerCase();
      if (/general education|cal-getc|getc|igetc|csu ge|transfer curriculum/.test(n)) return 'GE / Transfer Pattern';
      if (/transfer|a[ds]-t|aa-t|as-t/.test(n)) return 'Transfer Degree';
      if (/certificate/.test(n)) return 'Certificate';
      if (/degree|a\.s\.|a\.a\.|associate/.test(n)) return 'Degree';
      return 'Other';
    };

    // ---- v4: pathway structure from the official catalog ----
    // `window.ZTC_CATALOGS[year]` is generated by scripts/build-catalog-structure.py from the
    // catalog's Degrees and Certificates export. Each block is reconciled against the
    // units the catalog prints; blocks that do not reconcile are shown as unverified.
    // 'optional' sections are listed but never required; 'reviewed' ones were signed off by a
    // person in catalog/reviewed-sections.json.
    const CATALOG_VERIFIED = ['reconciled', 'approximated', 'no-courses', 'optional', 'reviewed'];
    const programsFromCatalog = (catalog) => {
      if (!catalog || !Array.isArray(catalog.programs) || !catalog.programs.length) {
        throw new Error('The catalog structure files (data/catalog-<year>.js) are missing or empty. Open the app from its full folder.');
      }
      return catalog.programs.map(program => ({
        ...program,
        type: programType(program.name)
      }));
    };
    // How many of a slot's options count toward it.
    //  - "from at least two areas": options from a single area can fill all but the
    //    places that must come from another area.
    //  - "or any course not taken from List A": options List A leaves over once it has
    //    used the ones it needs also count. `spareUsed` remembers what earlier sections
    //    of the same pathway have already claimed, so a left-over course counts once.
    const slotQualifying = (sg, slot, spareUsed) => {
      const ztc = slot.options.filter(optionIndex => sg.options[optionIndex].ztcOk);
      let own = ztc.length;
      if (slot.distinct) {
        const keyOf = (optionIndex) => slot.distinct.by === 'subject'
          ? (sg.options[optionIndex].courses[0] || {}).subject
          : sg.options[optionIndex].label;
        const missing = Math.max(0, slot.distinct.min - new Set(ztc.map(keyOf)).size);
        own = Math.max(0, Math.min(own, slot.need - missing));
      }
      const spare = (slot.spare || []).map(group => ({
        from: group.from,
        source: group.source,
        left: Math.max(0,
          group.options.filter(optionIndex => sg.options[optionIndex].ztcOk).length
          - group.used - (spareUsed.get(group.source) || 0))
      }));
      let shortfall = Math.max(0, slot.need - own);
      for (const group of spare) {
        const claimed = Math.min(group.left, shortfall);
        if (claimed > 0) spareUsed.set(group.source, (spareUsed.get(group.source) || 0) + claimed);
        shortfall -= claimed;
      }
      return { qualifying: own + spare.reduce((sum, group) => sum + group.left, 0), spare };
    };
    const catalogRequirementPlan = (subgroups, spareUsed = new Map()) =>
      subgroups.flatMap(sg => {
        const slots = (sg.slots || []).map((slot, index) => ({ slot, index, ...slotQualifying(sg, slot, spareUsed) }));
        // Shown beside the slot: what each named section leaves over for it.
        sg.spareLeft = Object.fromEntries(slots.filter(entry => entry.spare.length).map(entry => [entry.index, entry.spare]));
        if (sg.slotsNeeded && slots.length > sg.slotsNeeded) {
          // "Any three courses (maximum of one from each category)": each category is a
          // choice of one, and only `slotsNeeded` of the categories are required.
          return [{
            id: `${sg.id}-choice-any`,
            requiredCount: sg.slotsNeeded,
            candidates: slots.map(entry => ({
              id: `${sg.id}-slot-${entry.index}`,
              courses: [],
              ztcOk: entry.qualifying >= entry.slot.need
            }))
          }];
        }
        return slots.map(entry => ({
          id: `${sg.id}-${entry.slot.pool ? 'choice' : 'required'}-${entry.index}`,
          requiredCount: entry.slot.need,
          qualifying: entry.qualifying,
          candidates: entry.slot.options.map(optionIndex => ({
            id: `${sg.id}-option-${optionIndex}`,
            courses: sg.options[optionIndex].courses,
            ztcOk: sg.options[optionIndex].ztcOk
          }))
        }));
      });
    const fmtUnitRange = (range) =>
      range[0] === range[1] ? fmtUnits(range[0]) : `${fmtUnits(range[0])}–${fmtUnits(range[1])}`;

    const cleanTitle = (t) => String(t || '').replace(/\s+/g, ' ').replace(/\s*:\s*$/, '').trim();
    const hasLabAsterisk = (headerId) => String(headerId || '').includes('*');

    // A multi-course option is completable only when every member is offered
    // in the selected term and meets the ZTC threshold.
    const optionIsZtc = (courses) =>
      courses.length > 0 &&
      courses.every(c =>
        c.offered &&
        c.ztcPct !== null &&
        c.ztcPct >= ZTC_THRESHOLDS.ZTC_MIN
      );

    const optionUnitSum = (candidate) => {
      if (!candidate.courses.length || candidate.courses.some(c => c.units === null || c.units === undefined)) return null;
      return candidate.courses.reduce((sum, course) => sum + course.units, 0);
    };

    const scoreRequirementPlan = (groups) => {
      let reqTotal = 0, reqZtc = 0, ztcCount = 0, displayTotal = 0;
      let unitsMin = 0, unitsMax = 0;
      let unitsVerifiable = true;

      for (const group of groups) {
        const required = group.requiredCount;
        const qualifying = group.qualifying ?? group.candidates.filter(candidate => candidate.ztcOk).length;
        reqTotal += required;
        reqZtc += Math.min(required, qualifying);
        ztcCount += qualifying;
        displayTotal += group.candidates.length;

        const unitSums = group.candidates.map(optionUnitSum).filter(sum => sum !== null);
        unitSums.sort((a, b) => a - b);
        if (required === 0) continue;
        if (unitSums.length < required) {
          unitsVerifiable = false;
          continue;
        }
        unitsMin += unitSums.slice(0, required).reduce((sum, units) => sum + units, 0);
        unitsMax += unitSums.slice(-required).reduce((sum, units) => sum + units, 0);
        if (group.candidates.some(candidate => optionUnitSum(candidate) === null)) unitsVerifiable = false;
      }

      return {
        groups,
        anyZtc: reqZtc > 0,
        ztcCount,
        reqTotal,
        reqZtc,
        displayTotal,
        unitsMin,
        unitsMax,
        unitsVerifiable
      };
    };

    // ============================================================
    // MODEL BUILDERS
    // ============================================================
    // Analytics index: key -> { title, terms: { term -> metrics } }
    const buildAnalytics = (rows) => {
      const headers = rows[0];
      const data = rows.slice(1);
      const I = {
        course: findIdx(headers, ['course']),
        title: findIdx(headers, ['course title', 'title']),
        term: findIdx(headers, ['sec term', 'term']),
        total: findIdx(headers, ['total sections term', 'total sections']),
        ztcSec: findIdx(headers, ['ztc sections term', 'ztc sections']),
        surveysSub: findIdx(headers, ['surveys submitted term', 'surveys submitted']),
        surveysPend: findIdx(headers, ['pending surveys term', 'pending surveys']),
        surveyPct: findIdx(headers, ['survey completion pct term', 'survey completion']),
        ztcPct: findIdx(headers, ['ztc percent term', 'ztc percent']),
        ztca: findIdx(headers, ['oer ztca percent term']),
        ztcc: findIdx(headers, ['oer ztcc percent term']),
        ztce: findIdx(headers, ['oer ztce percent term']),
        ztcf: findIdx(headers, ['oer ztcf percent term']),
        ztcg: findIdx(headers, ['oer ztcg percent term']),
        lct: findIdx(headers, ['lct percent term'])
      };
      if (I.course === -1 || I.term === -1 || I.ztcPct === -1) {
        throw new Error('Course Analytics file is missing required columns (Course, Sec Term, Ztc Percent Term).');
      }
      const index = {};
      const termSet = new Set();
      for (const r of data) {
        const key = normCourseField(r[I.course]);
        if (!key) continue;
        const term = String(r[I.term] || '').trim();
        if (!term) continue;
        termSet.add(term);
        if (!index[key]) index[key] = { title: (r[I.title] || '').trim(), terms: {} };
        if (!index[key].title && I.title !== -1) index[key].title = (r[I.title] || '').trim();
        index[key].terms[term] = {
          ztcPct: parsePct(r[I.ztcPct]),
          surveyPct: I.surveyPct !== -1 ? parsePct(r[I.surveyPct]) : null,
          surveysSub: I.surveysSub !== -1 ? parseCount(r[I.surveysSub]) : null,
          surveysPend: I.surveysPend !== -1 ? parseCount(r[I.surveysPend]) : null,
          totalSec: I.total !== -1 ? parseCount(r[I.total]) : null,
          ztcSec: I.ztcSec !== -1 ? parseCount(r[I.ztcSec]) : null,
          ztca: I.ztca !== -1 ? parsePct(r[I.ztca]) : null,
          ztcc: I.ztcc !== -1 ? parsePct(r[I.ztcc]) : null,
          ztce: I.ztce !== -1 ? parsePct(r[I.ztce]) : null,
          ztcf: I.ztcf !== -1 ? parsePct(r[I.ztcf]) : null,
          ztcg: I.ztcg !== -1 ? parsePct(r[I.ztcg]) : null,
          lct: I.lct !== -1 ? parsePct(r[I.lct]) : null
        };
      }
      return { index, terms: sortTerms(Array.from(termSet)) };
    };

    // ============================================================
    // PROGRAM METRIC COMPUTATION (per selected term)
    // ============================================================
    const courseMetrics = (analytics, key, term) => {
      const rec = analytics.index[key];
      if (!rec) return { found: false, offered: false, m: null, title: '' };
      const m = isYearKey(term) ? yearRecord(rec, term) : rec.terms[term];
      if (!m) return { found: true, offered: false, m: null, title: rec.title };
      return { found: true, offered: true, m, title: rec.title };
    };

    // Merge per-term analytics into a course descriptor. `base` carries whatever
    // is already known (subject/number/title/units from the catalog).
    const enrichCourse = (base, analytics, term) => {
      const cm = courseMetrics(analytics, base.key, term);
      const pct = cm.offered ? cm.m.ztcPct : null;
      return {
        ...base,
        analyticsTitle: cm.title,
        offered: cm.offered,
        found: cm.found,
        ztcPct: pct,
        surveyPct: cm.offered ? cm.m.surveyPct : null,
        status: ztcStatus(pct),
        // Chancellor's Office definition: ZTC-passing with >=1 ZTC section
        coZtc: !!(cm.offered && cm.m.ztcSec !== null && cm.m.ztcSec >= ZTC_THRESHOLDS.CO_MIN_SECTIONS),
        metrics: cm.offered ? cm.m : null
      };
    };

    const enrichCourseFromKey = (key, analytics, term) =>
      enrichCourse({ key, ...parseCourseKey(key), courseTitle: '' }, analytics, term);

    // Build an enriched view for one program at a given term
    const computeProgramView = (program, analytics, term) => {
      let reqTotal = 0, reqZtc = 0;
      let unitsRequired = 0;
      let unitsRequiredUnverifiable = false;

      // Left-over options already claimed by an earlier section of this pathway.
      const spareUsed = new Map();
      const areas = program.areas.map(area => {
        const subgroups = area.subgroups.map(sg => {
          const courses = sg.courses.map(c => enrichCourse(c, analytics, term));
          const options = sg.options && sg.options.length
            ? sg.options.map(opt => {
              const oCourses = opt.courses.map(c => enrichCourse(c, analytics, term));
              return {
                label: opt.label,
                courses: oCourses,
                ztcOk: optionIsZtc(oCourses),
                ...(opt.choice ? { choice: opt.choice } : {})
              };
            })
            : null;
          return { ...sg, courses, options };
        });

        // Denominators come from the catalog requirement structure, not only courses
        // offered in the selected period. Unavailable or unknown courses remain unmet
        // requirements and therefore cannot inflate adoption.
        const score = scoreRequirementPlan(catalogRequirementPlan(subgroups, spareUsed));
        const { anyZtc, ztcCount, reqTotal: aReqTotal, reqZtc: aReqZtc } = score;
        reqTotal += aReqTotal; reqZtc += aReqZtc;

        // The catalog's printed units are authoritative; fall back to the listed courses.
        const unitsMin = area.catalogUnits ? area.catalogUnits[0] : score.unitsMin;
        const unitsMax = area.catalogUnits ? area.catalogUnits[1] : score.unitsMax;
        const unitsUnverifiable = !area.catalogUnits && !score.unitsVerifiable;
        unitsRequired += unitsMin;
        unitsRequiredUnverifiable = unitsRequiredUnverifiable || unitsUnverifiable;
        const unitsLabel = unitsMin <= 0
          ? (unitsUnverifiable ? 'unverifiable' : '')
          : (unitsUnverifiable
            ? `≥${fmtUnits(unitsMin)}`
            : (unitsMin === unitsMax ? fmtUnits(unitsMin) : `${fmtUnits(unitsMin)}–${fmtUnits(unitsMax)}`));

        const req = area.requirement || { choice: null, n: null };
        return {
          ...area, subgroups,
          isChoice: req.choice === true, requiredCount: req.n,
          unitsLabel, anyZtc, ztcCount, dataCount: score.displayTotal,
          requirementSlots: score.groups,
          // The structure read from the catalog could not be confirmed against its printed units.
          choiceCaveat: !CATALOG_VERIFIED.includes(area.reconciliation),
          unscored: area.reconciliation === 'unscored',
          unitsUnverifiable,
          areaPct: aReqTotal > 0 ? Math.round((aReqZtc / aReqTotal) * 100) : null,
          satisfiable: aReqTotal > 0 && aReqZtc === aReqTotal
        };
      });

      // Course-summary metrics are program-wide unique-course metrics. A course
      // appearing in more than one section counts once.
      let coursesWithData = 0, coursesTotal = 0;
      let surveySum = 0, surveyN = 0;
      let coCount = 0;
      const seenKeys = new Set();
      for (const area of areas) {
        for (const sg of area.subgroups) {
          for (const c of sg.courses) {
            if (c.key && seenKeys.has(c.key)) continue;
            if (c.key) seenKeys.add(c.key);
            coursesTotal += 1;
            if (c.offered && c.ztcPct !== null) coursesWithData += 1;
            if (c.offered && c.surveyPct !== null) { surveySum += c.surveyPct; surveyN += 1; }
            if (c.coZtc) coCount += 1;
          }
        }
      }

      const adoptionPct = reqTotal > 0 ? Math.round((reqZtc / reqTotal) * 100) : null;
      const avgSurvey = surveyN > 0 ? Math.round(surveySum / surveyN) : null;
      return {
        areas, adoptionPct, reqTotal, reqZtc,
        coursesWithData, coursesTotal, avgSurvey, coCount,
        unitsRequired: Math.round(unitsRequired * 100) / 100,
        choiceCaveatAreas: areas.filter(area => area.choiceCaveat).length,
        unitsRequiredUnverifiable,
        unitsRequiredLabel: program.catalogTotalUnits
          ? fmtUnitRange(program.catalogTotalUnits)
          : `${unitsRequiredUnverifiable ? '≥' : ''}${fmtUnits(unitsRequired)}`
      };
    };

    // Institution rollup from all active pathways (institution KPIs are not sidebar-filtered).
    const computeInstitutionStats = (programList, adoptionMap) => {
      const vals = programList.map(p => adoptionMap[p.name]?.pct).filter(v => v !== null && v !== undefined);
      const avg = vals.length ? Math.round(vals.reduce((s, v) => s + v, 0) / vals.length) : null;
      return {
        total: programList.length,
        scored: vals.length,
        noData: programList.length - vals.length,
        avg,
        full: vals.filter(v => v >= 100).length,
        high: vals.filter(v => v >= ZTC_THRESHOLDS.ZTC_MIN).length,
        partial: vals.filter(v => v >= ZTC_THRESHOLDS.PARTIAL_MIN && v < ZTC_THRESHOLDS.ZTC_MIN).length,
        low: vals.filter(v => v < ZTC_THRESHOLDS.PARTIAL_MIN).length
      };
    };

    // PRODUCTION MODEL TEST END
    // ============================================================
    // SMALL COMPONENTS
    // ============================================================
    const DashboardSection = ({ title, subtitle, badge, children, compact = false }) => (
      <section className={compact ? 'space-y-2' : 'space-y-4'}>
        <div className="flex items-start justify-between gap-3 flex-wrap">
          <div>
            {compact
              ? <h3 className="text-sm font-bold tracking-tight">{title}</h3>
              : <h2 className="text-lg font-bold tracking-tight">{title}</h2>}
            {subtitle && <p className={`${compact ? 'text-xs mt-0.5' : 'text-sm opacity-70 mt-0.5'}`}>{subtitle}</p>}
          </div>
          {badge}
        </div>
        {children}
      </section>
    );

    // `hint` is the hover text; `compact` fits the button into a line of small text.
    const DashboardInfoButton = ({ label, onClick, t, hint, compact = false }) => (
      <button type="button" onClick={onClick}
        aria-label={`Explain ${label}`}
        title={hint || `Explain ${label}`}
        style={compact ? { width: '24px', height: '24px', verticalAlign: 'middle' } : { width: '28px', height: '28px' }}
        className={`flex-shrink-0 rounded-full border ${t.cardBorder} ${t.card} ${t.cardHover} inline-flex items-center justify-center ${compact ? 'text-xs' : 'text-sm'} font-bold leading-none`}>
        <span aria-hidden="true" style={{ fontFamily: 'Georgia, serif', fontStyle: 'italic' }}>i</span>
      </button>
    );

    const AppFooter = ({ t }) => (
      <footer role="contentinfo" className={`flex-shrink-0 border-t ${t.headerBorder} ${t.header} px-4 py-2 text-center`}>
        <h2 className="sr-only">Application information</h2>
        <p className={`text-[10px] leading-snug ${t.textMuted} my-0.5`}>
          <strong className={`font-semibold ${t.text}`}>Contact:</strong> {APP_META.contact} · {APP_META.department}
        </p>
        <p className={`text-[10px] leading-snug ${t.textMuted} my-0.5`}>
          {APP_META.useLine} · {APP_META.accessibility} · {APP_META.a11yNote}
        </p>
        <p className={`text-[10px] leading-snug ${t.textMuted} my-0.5`}>
          <strong className={`font-semibold ${t.text}`}>Hosted app:</strong>{' '}
          <a href={APP_META.hostedUrl} className="underline hover:opacity-90">{APP_META.hostedUrl}</a>
        </p>
      </footer>
    );

    const SidebarSearch = ({ value, onChange, label, placeholder, t }) => (
      <div className={`flex items-center gap-2 rounded-lg border ${t.cardBorder} ${t.input} px-2.5 py-1.5`}>
        <Icons.Search className={`w-4 h-4 ${t.faint}`} aria-hidden="true" />
        <input value={value} onChange={(e) => onChange(e.target.value)} aria-label={label} placeholder={placeholder} className="bg-transparent text-sm outline-none w-full" />
        {value && <button type="button" onClick={() => onChange('')} aria-label="Clear search"><Icons.X className="w-4 h-4" aria-hidden="true" /></button>}
      </div>
    );
    const Ring = ({ pct, size = 72, stroke = 8, label }) => {
      const r = (size - stroke) / 2;
      const c = 2 * Math.PI * r;
      const val = pct === null || pct === undefined ? 0 : pct;
      const off = c - (val / 100) * c;
      const text = pct === null || pct === undefined ? 'no data' : pct + '%';
      return (
        <svg width={size} height={size} className="flex-shrink-0" role="img"
          aria-label={`${label || 'ZTC adoption'}: ${text}`}>
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="rgba(148,163,184,0.25)" strokeWidth={stroke} />
          <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={pathwayRingColor(pct)} strokeWidth={stroke}
            strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
            transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: 'stroke-dashoffset 0.4s ease' }} />
          <text x="50%" y="50%" dominantBaseline="central" textAnchor="middle"
            fill={pathwayRingColor(pct)} fontSize={size * 0.26} fontWeight="700">
            {pct === null || pct === undefined ? '—' : pct + '%'}
          </text>
        </svg>
      );
    };

    const StatusBadge = ({ status, small, dark = true }) => {
      // Text shades chosen for >=4.5:1 contrast against the translucent tint on each theme.
      const cfg = {
        'ztc': ['bg-green-500/20 border-green-500/40', dark ? 'text-green-300' : 'text-green-800', 'ZTC'],
        'partial': ['bg-amber-500/20 border-amber-500/40', dark ? 'text-amber-200' : 'text-amber-800', 'Partial'],
        'not-ztc': ['bg-red-500/20 border-red-500/40', dark ? 'text-red-300' : 'text-red-800', 'Not ZTC'],
        'no-data': ['bg-slate-500/25 border-slate-500/50', dark ? 'text-slate-200' : 'text-slate-700', 'No data']
      }[status] || ['bg-slate-500/25 border-slate-500/50', dark ? 'text-slate-200' : 'text-slate-700', '—'];
      return (
        <span className={`inline-flex items-center rounded-full border ${cfg[0]} ${cfg[1]} ${small ? 'px-2 py-0.5 text-[10px]' : 'px-2.5 py-1 text-xs'} font-semibold`}>
          {cfg[2]}
        </span>
      );
    };

    // Purple Chancellor's Office ZTC identifier (course has >=1 ZTC section).
    // Distinct from the green Chaffey badge (>=75% of sections ZTC).
    const CoBadge = ({ small, dark = true }) => (
      <span role="img" aria-label="Chancellor's Office ZTC: at least one section is zero textbook cost"
        title="Chancellor's Office ZTC — at least one section is offered at Zero Textbook Cost (Chaffey's internal bar is 75%+ of sections)."
        className={`inline-flex items-center gap-1 rounded-full border border-violet-500/50 bg-violet-500/20 ${dark ? 'text-violet-200' : 'text-violet-800'} ${small ? 'px-1.5 py-0.5 text-[10px]' : 'px-2.5 py-1 text-xs'} font-semibold`}>
        <Icons.Landmark className={small ? 'w-3 h-3' : 'w-3.5 h-3.5'} aria-hidden="true" /> CO ZTC
      </span>
    );

    // Custom listbox — native <select> popups ignore theme CSS on macOS.
    const ThemedSelect = ({ value, onChange, options, ariaLabel, t, dark, className = '', buttonClassName = '', align = 'left', menuClassName = '' }) => {
      const [open, setOpen] = useState(false);
      const [activeIdx, setActiveIdx] = useState(0);
      const rootRef = useRef(null);
      const btnRef = useRef(null);
      const display = options.find(o => o.value === value)?.label ?? value;
      const selectedIdx = Math.max(0, options.findIndex(o => o.value === value));

      useEffect(() => {
        if (!open) return;
        setActiveIdx(selectedIdx);
        const onDown = (e) => {
          if (rootRef.current && !rootRef.current.contains(e.target)) setOpen(false);
        };
        const onKey = (e) => {
          if (e.key === 'Escape') {
            e.preventDefault();
            setOpen(false);
            btnRef.current?.focus();
            return;
          }
          if (e.key === 'ArrowDown') {
            e.preventDefault();
            setActiveIdx(i => Math.min(i + 1, options.length - 1));
          } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            setActiveIdx(i => Math.max(i - 1, 0));
          } else if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            const pick = options[activeIdx];
            if (pick) { onChange(pick.value); setOpen(false); btnRef.current?.focus(); }
          }
        };
        document.addEventListener('mousedown', onDown);
        document.addEventListener('keydown', onKey);
        return () => {
          document.removeEventListener('mousedown', onDown);
          document.removeEventListener('keydown', onKey);
        };
      }, [open, activeIdx, options, onChange, selectedIdx]);

      const pickedCls = dark ? 'bg-blue-600/30 font-semibold' : 'bg-blue-50 text-blue-900 font-semibold';
      const activeCls = dark ? 'bg-zinc-700/70' : 'bg-gray-100';

      return (
        <div ref={rootRef} className={`relative ${className}`}>
          <button ref={btnRef} type="button"
            aria-haspopup="listbox" aria-expanded={open} aria-label={ariaLabel}
            onClick={() => setOpen(o => !o)}
            className={`w-full flex items-center justify-between gap-2 rounded-lg border ${t.cardBorder} ${t.input} cursor-pointer ${buttonClassName}`}>
            <span className="truncate text-left flex-1">{display}</span>
            <Icons.ChevronDown className={`w-4 h-4 flex-shrink-0 opacity-70 transition-transform ${open ? 'rotate-180' : ''}`} aria-hidden="true" />
          </button>
          {open && (
            <ul role="listbox" aria-label={ariaLabel}
              className={`absolute z-50 mt-1 max-h-64 overflow-auto rounded-lg border ${t.panelBorder} ${t.panel} shadow-xl py-1 list-none m-0 ${align === 'right' ? 'right-0' : 'left-0'} min-w-full ${menuClassName}`}>
              {options.map((opt, i) => {
                const isSelected = opt.value === value;
                const isActive = i === activeIdx;
                return (
                  <li key={opt.value} role="presentation">
                    <button type="button" role="option" aria-selected={isSelected}
                      className={`w-full text-left px-3 py-2 text-sm transition-colors ${isSelected ? pickedCls : ''} ${!isSelected && isActive ? activeCls : ''} ${!isSelected ? t.cardHover : ''}`}
                      onMouseEnter={() => setActiveIdx(i)}
                      onClick={() => { onChange(opt.value); setOpen(false); btnRef.current?.focus(); }}>
                      <span className="flex items-center gap-2">
                        <span className="w-4 flex-shrink-0 flex items-center justify-center" aria-hidden="true">
                          {isSelected ? <Icons.Check className="w-4 h-4 text-blue-500" /> : null}
                        </span>
                        <span className="leading-snug">{opt.label}</span>
                      </span>
                    </button>
                  </li>
                );
              })}
            </ul>
          )}
        </div>
      );
    };

    // Soft label for exported Group Title bands (not a CurriQunet tree replica)
    const formatGroupLabel = (label) => {
      if (!label) return '';
      const s = cleanTitle(label);
      if (!s) return '';
      if (/^(either|or)$/i.test(s) || /^group\s*\d+$/i.test(s) || /^choose\b/i.test(s)) {
        return /:$/.test(s) ? s : s + ':';
      }
      return s;
    };

    // Course row — ZTC decision card (primary Pathway layout)
    const CourseRow = ({ c, t, dark, selectedTerm, onOpen, showLabStar = true }) => {
      const title = c.courseTitle || c.analyticsTitle || '';
      const labStar = showLabStar && hasLabAsterisk(c.headerId);
      const byYear = isYearKey(selectedTerm);
      const missed = (byYear && c.metrics && c.metrics.missedTerms) || [];
      const label = `${c.subject}-${c.number}${labStar ? ' (lab asterisk)' : ''}, ${title}. ` +
        (c.offered ? `${byYear ? 'Lowest term ZTC adoption' : 'ZTC adoption'} ${c.ztcPct === null ? 'no data' : c.ztcPct + '%'}, survey completion ${c.surveyPct === null ? 'no data' : c.surveyPct + '%'}, status ${c.status}.` : `Not offered in ${periodLabel(selectedTerm)}.`) +
        (missed.length ? ` Below 75% in ${missed.join(', ')}.` : '') +
        (c.coZtc ? ' Chancellor\u2019s Office ZTC.' : '') +
        (c.found ? ' Activate for details.' : '');
      const inner = (
        <>
          <div className="min-w-0">
            <div className="font-mono text-sm font-semibold">
              {c.subject}-{c.number}
              {labStar && (
                <span className={`ml-1 font-sans text-xs font-semibold ${dark ? 'text-zinc-400' : 'text-gray-500'}`} title="Laboratory course (*)" aria-hidden="true">*</span>
              )}
            </div>
          </div>
          <div className="min-w-0">
            <div className="text-sm line-clamp-2 sm:truncate">{title}</div>
            <div className={`text-[11px] ${t.faint}`}>
              {c.units !== null ? `${fmtUnits(c.units)} units` : ''}
              {!c.offered && <span className="ml-1">· not offered {periodLabel(selectedTerm)}</span>}
              {missed.length > 0 && <span className={`ml-1 font-semibold ${dark ? 'text-red-400' : 'text-red-800'}`} data-missed-terms="true">· below 75% in {missed.join(', ')}</span>}
            </div>
          </div>
          <div className="flex items-center gap-1.5 sm:gap-3 justify-end flex-shrink-0">
            <div className="text-right hidden sm:block w-14">
              <div className={`text-[10px] ${t.faint} leading-none`}>survey</div>
              <div className="text-xs font-semibold">{c.surveyPct === null ? '—' : c.surveyPct + '%'}</div>
            </div>
            <div className="text-right w-12">
              <div className={`text-[10px] ${t.faint} leading-none`}>{byYear ? 'low term' : 'ZTC'}</div>
              <div className={`text-sm font-bold ${pctColor(c.ztcPct, dark)}`}>{c.ztcPct === null ? '—' : c.ztcPct + '%'}</div>
            </div>
            {c.coZtc && <CoBadge small dark={dark} />}
            <StatusBadge status={c.status} small dark={dark} />
          </div>
        </>
      );
      const cls = `w-full text-left grid grid-cols-[auto_1fr_auto] items-center gap-1.5 sm:gap-3 px-2.5 sm:px-3 py-2 rounded-lg border min-w-0 ${t.cardBorder} ${t.card} transition-colors`;
      if (!c.found) {
        return <div className={cls} aria-label={label} data-course-key={c.key}>{inner}</div>;
      }
      return (
        <button type="button" onClick={(e) => onOpen(c, e.currentTarget)} aria-label={label} data-course-key={c.key} className={`${cls} ${t.cardHover} cursor-pointer`}>
          {inner}
        </button>
      );
    };

    // Compact choice-band chip when Group Title is present in the export
    const ChoiceBand = ({ label, ztcOk, dark }) => {
      const text = formatGroupLabel(label);
      if (!text) return null;
      return (
        <div className="flex items-center flex-wrap gap-2 px-0.5 mb-2 mt-1">
          <span className={`inline-flex items-center rounded-md px-2.5 py-1 text-[11px] font-semibold border ${
            dark ? 'bg-zinc-800/80 border-zinc-600 text-zinc-200' : 'bg-gray-100 border-gray-300 text-gray-800'
          }`}>
            {text}
          </span>
          {ztcOk && (
            <span className={`text-[11px] font-medium ${dark ? 'text-green-400' : 'text-green-700'}`}>ZTC path</span>
          )}
        </div>
      );
    };

    // Pathway subgroup: its requirements, or its courses when the block is listed but not scored
    const SubgroupCourses = ({ sg, t, dark, selectedTerm, onOpen }) => {
      const open = (course, el) => onOpen(course, el);

      if (sg.slots && sg.slots.length) {
        const renderOption = (optionIndex, keyPrefix) => {
          const opt = sg.options[optionIndex];
          const multi = opt.courses.length > 1;
          return (
            <div key={keyPrefix + '-' + optionIndex} className={multi ? `space-y-1 rounded-lg border px-2.5 py-2 min-w-0 ${dark ? 'border-zinc-700/80 bg-zinc-950/25' : 'border-gray-200 bg-gray-50/70'}` : 'space-y-2 min-w-0'}>
              {opt.courses.map((c, ci) => (
                <React.Fragment key={keyPrefix + '-' + optionIndex + '-' + ci}>
                  {ci > 0 && (
                    <div className={`text-[10px] font-semibold uppercase tracking-wider px-1 my-1 ${t.faint}`} aria-hidden="true">and</div>
                  )}
                  <CourseRow c={c} t={t} dark={dark} selectedTerm={selectedTerm} onOpen={open} />
                </React.Fragment>
              ))}
            </div>
          );
        };
        // "... or any course not taken from List A": what that section leaves over for this one.
        const spareNote = (slotIndex) => ((sg.spareLeft || {})[slotIndex] || []).map((group, gi) => (
          <p key={sg.id + '-spare-' + slotIndex + '-' + gi} className={`text-xs leading-snug px-0.5 ${t.textMuted}`} role="note" data-spare-note="true">
            Also counts: any course not taken from {group.from}
            {' '}({group.left} ZTC option{group.left === 1 ? '' : 's'} left over once {group.from} and any earlier list are met).
          </p>
        ));
        return (
          <div className="space-y-3 min-w-0" role="list" aria-label="Requirements">
            {sg.slotsNeeded && sg.slots.length > sg.slotsNeeded && (
              <p className={`text-xs leading-snug px-0.5 ${t.textMuted}`} role="note" data-slots-needed="true">
                Any {sg.slotsNeeded} of these {sg.slots.length} groups, one course from each.
              </p>
            )}
            {sg.slots.map((slot, si) => {
              const key = sg.id + '-slot-' + si;
              if (slot.summary) {
                // Met by any course of a large pool listed elsewhere: show the rule, not the list.
                const meeting = slot.options.filter(optionIndex => sg.options[optionIndex].ztcOk).length;
                const met = meeting >= slot.need;
                return (
                  <div key={key} role="listitem"
                    className={`rounded-lg border px-3 py-2.5 min-w-0 ${dark ? 'border-zinc-700/80 bg-zinc-950/25' : 'border-gray-200 bg-gray-50/70'}`}>
                    {slot.label && <div className="text-sm font-medium leading-snug">{slot.label}</div>}
                    <div className={`text-xs leading-snug ${t.textMuted}`}>{slot.summaryLabel}</div>
                    <div className="text-xs mt-1">
                      <span className={`font-semibold ${met ? (dark ? 'text-green-400' : 'text-green-800') : (dark ? 'text-red-400' : 'text-red-800')}`}>
                        {met ? 'Met' : 'Not met'}
                      </span>
                      <span className={t.textMuted}> · {meeting} of {slot.options.length} qualifying {slot.options.length === 1 ? 'option meets' : 'options meet'} the Chaffey ZTC threshold in {periodLabel(selectedTerm)}</span>
                    </div>
                  </div>
                );
              }
              const isChoice = !slot.pool && slot.options.length > 1;
              if (!isChoice) {
                // Inside a longer list the catalog prints some entries as "Either ... Or ...".
                // Each alternative is its own option; show them together with the "or".
                const runs = [];
                for (const optionIndex of slot.options) {
                  const choice = sg.options[optionIndex].choice || null;
                  const last = runs[runs.length - 1];
                  if (choice && last && last.choice === choice) last.options.push(optionIndex);
                  else runs.push({ choice, options: [optionIndex] });
                }
                const soleName = sg.slotsNeeded && !slot.pool && slot.label ? slot.label : '';
                return (
                  <div key={key} role="listitem" className="space-y-2 min-w-0">
                    {soleName && <div className={`text-[11px] font-semibold px-0.5 ${t.textMuted}`}>{soleName}</div>}
                    {runs.map((run, ri) => (run.choice && run.options.length > 1) ? (
                      <div key={key + '-either-' + ri} role="group" data-either-or="true"
                        aria-label={`${formatGroupLabel(sg.options[run.options[0]].label) || 'Either'}: ${run.options.length} alternatives`}
                        className={`rounded-lg border px-2.5 py-2 min-w-0 ${dark ? 'border-zinc-700/80 bg-zinc-950/25' : 'border-gray-200 bg-gray-50/70'}`}>
                        <ChoiceBand label={sg.options[run.options[0]].label || 'Either'}
                          ztcOk={run.options.some(optionIndex => sg.options[optionIndex].ztcOk)} dark={dark} />
                        <div className="space-y-2 min-w-0">
                          {run.options.map((optionIndex, oi) => (
                            <React.Fragment key={key + '-either-' + ri + '-' + oi}>
                              {oi > 0 && (
                                <div className={`text-[10px] font-semibold uppercase tracking-wider px-1 ${t.faint}`}>or</div>
                              )}
                              {renderOption(optionIndex, key)}
                            </React.Fragment>
                          ))}
                        </div>
                      </div>
                    ) : run.options.map(optionIndex => renderOption(optionIndex, key)))}
                    {spareNote(si)}
                  </div>
                );
              }
              const qualifying = slot.options.filter(optionIndex => sg.options[optionIndex].ztcOk).length;
              // A named group ("Combatives") keeps its name in front of the rule.
              const groupName = slot.label && !/^(choose|either|or|select|any)\b/i.test(slot.label) ? `${slot.label} · ` : '';
              const label = slot.unitsTarget
                ? `${groupName}${fmtUnitRange(slot.unitsTarget)} units from these`
                : `${groupName}choose ${slot.need} of ${slot.options.length}`.replace(/^c/, 'C');
              return (
                <div key={key} role="listitem"
                  className={`rounded-lg border px-2.5 py-2 min-w-0 ${dark ? 'border-zinc-700/80 bg-zinc-950/25' : 'border-gray-200 bg-gray-50/70'}`}>
                  <ChoiceBand label={label} ztcOk={qualifying >= slot.need} dark={dark} />
                  <div className="space-y-2 min-w-0">
                    {slot.options.map((optionIndex, oi) => (
                      <React.Fragment key={key + '-alt-' + oi}>
                        {oi > 0 && (
                          <div className={`text-[10px] font-semibold uppercase tracking-wider px-1 ${t.faint}`} aria-hidden="true">or</div>
                        )}
                        {renderOption(optionIndex, key)}
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        );
      }

      if (sg.options && sg.options.length) {
        const anyLabeled = sg.options.some(o => o.label);
        return (
          <div className="space-y-3 min-w-0" role="list" aria-label="Course options">
            {sg.options.map((opt, oi) => {
              const multi = opt.courses.length > 1;
              return (
                <div key={sg.id + '-opt-' + oi} role="listitem" className={`min-w-0 ${anyLabeled && opt.label ? 'space-y-1' : ''}`}>
                  {opt.label && <ChoiceBand label={opt.label} ztcOk={opt.ztcOk} dark={dark} />}
                  <div className={multi ? `space-y-1 rounded-lg border px-2.5 py-2 min-w-0 ${dark ? 'border-zinc-700/80 bg-zinc-950/25' : 'border-gray-200 bg-gray-50/70'}` : 'space-y-2 min-w-0'}>
                    {opt.courses.map((c, ci) => (
                      <React.Fragment key={sg.id + '-opt-' + oi + '-' + ci}>
                        {ci > 0 && (
                          <div className={`text-[10px] font-semibold uppercase tracking-wider px-1 my-1 ${t.faint}`} aria-hidden="true">
                            and
                          </div>
                        )}
                        <CourseRow c={c} t={t} dark={dark} selectedTerm={selectedTerm} onOpen={open} />
                      </React.Fragment>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        );
      }

      return (
        <div className="space-y-2 min-w-0">
          {sg.courses.map((c, i) => (
            <CourseRow key={sg.id + '-' + i} c={c} t={t} dark={dark} selectedTerm={selectedTerm} onOpen={open} />
          ))}
        </div>
      );
    };

    // ============================================================
    // TREND CHART (Chart.js) — accessible: role=img + aria-label + sr-only table
    // ============================================================
    const TrendChart = ({ series, dark, height = 200, ariaLabel, summary, type = 'line' }) => {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      useEffect(() => {
        if (!canvasRef.current || !window.Chart) return;
        const grid = dark ? 'rgba(148,163,184,0.15)' : 'rgba(100,116,139,0.18)';
        const tick = dark ? '#cbd5e1' : '#475569';
        const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const isBar = type === 'bar';
        const ds = series.map(s => isBar ? ({
          label: s.label, data: s.data,
          backgroundColor: s.colors || (s.color + 'cc'), borderColor: s.colors || s.color, borderWidth: 1,
          borderRadius: 3, maxBarThickness: 26
        }) : ({
          label: s.label, data: s.data, borderColor: s.color, backgroundColor: s.color + '33',
          borderWidth: 2, pointRadius: 2.5, pointHoverRadius: 5, tension: 0.3, spanGaps: true, fill: false
        }));
        chartRef.current = new window.Chart(canvasRef.current, {
          type,
          data: { labels: series[0] ? series[0].labels : [], datasets: ds },
          options: {
            responsive: true, maintainAspectRatio: false,
            animation: reduce ? false : { duration: 400 },
            interaction: { mode: 'index', intersect: false },
            scales: {
              y: { min: 0, max: 100, ticks: { color: tick, callback: (v) => v + '%' }, grid: { color: grid } },
              x: { ticks: { color: tick, maxRotation: 0, autoSkip: true, maxTicksLimit: isBar ? 12 : 8 }, grid: { color: grid, display: !isBar } }
            },
            plugins: {
              legend: { display: ds.length > 1, labels: { color: tick, boxWidth: 12 } },
              tooltip: { callbacks: { label: (it) => `${it.dataset.label}: ${it.parsed.y === null ? 'n/a' : it.parsed.y + '%'}` } }
            }
          }
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [series, dark, type]);
      return (
        <div style={{ height }} role="img" aria-label={ariaLabel}>
          <canvas ref={canvasRef} aria-hidden="true"></canvas>
          {summary && <span className="sr-only">{summary}</span>}
        </div>
      );
    };

    const Sparkline = ({ data, color = '#22c55e', ariaLabel }) => {
      const points = data
        .map((value, index) => value === null || value === undefined ? null : {
          x: data.length <= 1 ? 80 : 4 + (index / (data.length - 1)) * 152,
          y: 40 - (Math.max(0, Math.min(100, value)) / 100) * 36
        })
        .filter(Boolean);
      const path = points.map((point, index) => `${index === 0 ? 'M' : 'L'} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`).join(' ');
      return (
        <svg viewBox="0 0 160 44" className="w-full h-11" role="img" aria-label={ariaLabel}>
          <line x1="4" y1="40" x2="156" y2="40" stroke="currentColor" opacity="0.18" aria-hidden="true" />
